<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <meta name="robots" content="noindex">
  <title>YT Zero</title>
  <!--
    A view-only television page: "Continue watching" and the Main feed (thumbnail,
    channel, title) and a full-screen player. Remote keys only:
      browse  arrows move, OK plays, Back leaves the app
      player  Right +30 s, Left −15 s, OK (or a click) pauses/plays, Back returns
      numbers 1 rejects, 2 marks as watched (the focused or playing video),
              3 refreshes the feed. (The colour keys are taken by the LG TV itself.)
    It talks to the same API as the web client, with the session cookie the TV
    login page (/tv-login.html) sets.
  -->
  <style>
    :root { --bg: #0f0f0f; --fg: #f1f1f1; --muted: #a9a9a9; --accent: #3ea6ff; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: "LG Smart UI", "Museo Sans", system-ui, sans-serif; }
    body { overflow-x: hidden; }
    body.playing { overflow: hidden; }

    #legend { display: flex; justify-content: flex-end; gap: 32px; padding: 28px 80px 0; font-size: 20px; color: #8a8a8a; }
    #legend b {
      display: inline-block; min-width: 26px; padding: 1px 6px; margin-right: 10px; border-radius: 6px;
      border: 2px solid #6a6a6a; color: #cfcfcf; text-align: center; font-weight: 700;
    }

    .section-title { margin: 8px 80px 0; font-size: 28px; font-weight: 600; color: #d6d6d6; }
    .section-title[hidden], #continueRow[hidden] { display: none; }
    #continueRow {
      display: flex; gap: 40px; overflow-x: auto; scrollbar-width: none;
      padding: 28px 80px 36px; scroll-padding: 0 80px;
    }
    #continueRow::-webkit-scrollbar { display: none; }
    #continueRow .card { flex: 0 0 calc((1920px - 160px - 120px) / 4); }
    #grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 56px 40px;
      padding: 28px 80px 120px;
    }
    .card { outline: none; border-radius: 18px; transition: transform .15s ease; }
    .thumb {
      position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #1c1c1c;
      box-shadow: 0 0 0 0 transparent; transition: box-shadow .15s ease;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .progress { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,.3); }
    .progress div { height: 100%; background: #e5484d; }
    .card.focused { transform: scale(1.06); }
    .card.focused .thumb { box-shadow: 0 0 0 5px var(--accent); }
    .channel { margin: 16px 4px 4px; font-size: 22px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title {
      margin: 0 4px; font-size: 26px; line-height: 1.3; font-weight: 600;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    #message { padding: 160px 80px; text-align: center; font-size: 36px; color: var(--muted); }
    #message[hidden], #player[hidden] { display: none; }

    #toast {
      position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 20;
      padding: 18px 40px; border-radius: 999px; background: rgba(40,40,40,.95); font-size: 28px;
      opacity: 0; transition: opacity .25s ease; pointer-events: none;
    }
    #toast.show { opacity: 1; }

    #player { position: fixed; inset: 0; background: #000; z-index: 10; }
    #frame, #frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    /* The iframe never takes focus or clicks, so the remote's keys stay with this page. */
    #frame { pointer-events: none; }
    #clickLayer { position: absolute; inset: 0; cursor: pointer; }
    #overlay {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 120px 96px 72px;
      background: linear-gradient(transparent, rgba(0,0,0,.85));
      opacity: 0; transition: opacity .3s ease; pointer-events: none;
    }
    #overlay.show { opacity: 1; }
    #ovChannel { font-size: 26px; color: #d0d0d0; }
    #ovTitle { font-size: 40px; font-weight: 600; margin: 6px 0 28px; }
    #bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.25); overflow: hidden; }
    #barFill { height: 100%; width: 0; background: var(--accent); }
    #time { margin-top: 14px; font-size: 26px; color: #d0d0d0; font-variant-numeric: tabular-nums; }
    #flash {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      padding: 22px 44px; border-radius: 20px; background: rgba(0,0,0,.6);
      font-size: 48px; font-weight: 700; opacity: 0; transition: opacity .25s ease; pointer-events: none;
    }
    #flash.show { opacity: 1; }
    #playerError { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 36px; padding: 0 200px; }
    #playerError[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="legend"><span><b>1</b>Afvis</span><span><b>2</b>Markér som set</span><span><b>3</b>Opdater</span></div>
  <div id="continueTitle" class="section-title" hidden>Fortsæt med at se</div>
  <div id="continueRow" role="list" hidden></div>
  <div id="gridTitle" class="section-title" hidden>Main</div>
  <div id="grid" role="list"></div>
  <div id="message">Henter videoer…</div>
  <div id="toast" role="status"></div>

  <div id="player" hidden>
    <div id="frame"></div>
    <div id="clickLayer"></div>
    <div id="overlay">
      <div id="ovChannel"></div>
      <div id="ovTitle"></div>
      <div id="bar"><div id="barFill"></div></div>
      <div id="time"></div>
    </div>
    <div id="flash"></div>
    <div id="playerError" hidden></div>
  </div>

  <script>
  (function () {
    "use strict";

    var COLUMNS = 4;
    var PAGE_SIZE = 40;
    var SEEK_FORWARD = 30;
    var SEEK_BACK = 15;
    var KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, ENTER: 13, BACK: 461, ESC: 27, BACKSPACE: 8,
                PLAY: 415, PAUSE: 19, PLAY_PAUSE: 10252, FF: 417, RW: 412, STOP: 413,
                ONE: 49, TWO: 50, THREE: 51, NUM_ONE: 97, NUM_TWO: 98, NUM_THREE: 99 };

    var gridEl = document.getElementById("grid");
    var continueEl = document.getElementById("continueRow");
    var messageEl = document.getElementById("message");
    var playerEl = document.getElementById("player");
    var overlayEl = document.getElementById("overlay");
    var flashEl = document.getElementById("flash");
    var toastEl = document.getElementById("toast");
    var errorEl = document.getElementById("playerError");

    // Two sections; focus is a section plus an index into it.
    var sections = {
      cont: { el: continueEl, items: [], cards: [] },
      grid: { el: gridEl, items: [], cards: [] }
    };
    var focus = { s: "grid", i: 0 };
    var page = 0;
    var hasMore = true;
    var loading = false;
    var generation = 0; // bumps on refresh, so late answers from before it are dropped
    // Rejected or watched here: kept out even if a list fetched later still has them.
    var removed = {};

    // ---------- API ----------

    function api(path, options) {
      return fetch("/api" + path, Object.assign({ credentials: "same-origin", cache: "no-store" }, options || {}))
        .then(function (r) {
          if (r.status === 401) { window.location.replace("/tv-login.html"); throw new Error("unauthenticated"); }
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.status === 204 ? null : r.json().catch(function () { return null; });
        });
    }

    function post(path) { return api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }); }

    function thumbUrl(url) {
      if (!url) return "/nothumbnail.jpg";
      return /^https?:\/\//.test(url) ? "/api/img?u=" + encodeURIComponent(url) : url;
    }

    function playable(v) {
      return v && v.video_id && !removed[v.video_id] && !v.is_unavailable && !v.is_private && v.live_status !== "upcoming";
    }

    var toastTimer = null;
    function toast(text, ms) {
      toastEl.textContent = text;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      if (ms !== 0) toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, ms || 2200);
    }

    // ---------- Cards and sections ----------

    function makeCard(v, sectionName) {
      var card = document.createElement("div");
      card.className = "card";
      card.setAttribute("role", "listitem");
      var thumb = document.createElement("div");
      thumb.className = "thumb";
      var img = document.createElement("img");
      img.loading = "lazy";
      img.alt = "";
      img.src = thumbUrl(v.thumbnail);
      img.onerror = function () { img.onerror = null; img.src = "/nothumbnail.jpg"; };
      thumb.appendChild(img);
      if (sectionName === "cont" && v.watch_position && v.watch_duration) {
        var bar = document.createElement("div");
        bar.className = "progress";
        var fill = document.createElement("div");
        fill.style.width = Math.min(100, v.watch_position / v.watch_duration * 100) + "%";
        bar.appendChild(fill);
        thumb.appendChild(bar);
      }
      var channel = document.createElement("div");
      channel.className = "channel";
      channel.textContent = v.channel_title || "";
      var title = document.createElement("div");
      title.className = "title";
      title.textContent = v.title || "";
      card.appendChild(thumb);
      card.appendChild(channel);
      card.appendChild(title);
      // Look the index up when clicked: cards move as videos are removed.
      card.addEventListener("click", function () {
        var i = sections[sectionName].cards.indexOf(card);
        if (i >= 0) { setFocus(sectionName, i); openPlayer(); }
      });
      card.addEventListener("mouseenter", function () {
        var i = sections[sectionName].cards.indexOf(card);
        if (i >= 0) setFocus(sectionName, i, true);
      });
      return card;
    }

    function addItem(sectionName, v) {
      var sec = sections[sectionName];
      var card = makeCard(v, sectionName);
      sec.items.push(v);
      sec.cards.push(card);
      sec.el.appendChild(card);
    }

    function clearSection(sectionName) {
      var sec = sections[sectionName];
      sec.items = [];
      sec.cards = [];
      sec.el.innerHTML = "";
    }

    function hasSection(name) { return sections[name].cards.length > 0; }

    function updateChrome() {
      var hasCont = hasSection("cont");
      continueEl.hidden = !hasCont;
      document.getElementById("continueTitle").hidden = !hasCont;
      document.getElementById("gridTitle").hidden = !hasCont || !hasSection("grid");
      if (!hasCont && !hasSection("grid") && !loading) {
        messageEl.textContent = "Ingen nye videoer";
        messageEl.hidden = false;
      } else if (hasCont || hasSection("grid")) {
        messageEl.hidden = true;
      }
    }

    function continueIds() {
      var ids = {};
      sections.cont.items.forEach(function (v) { ids[v.video_id] = true; });
      return ids;
    }

    // ---------- Loading ----------

    function loadContinue() {
      var gen = generation;
      return api("/in-progress").then(function (data) {
        if (gen !== generation) return;
        var list = ((data && data.videos) || []).filter(function (v) { return playable(v) && !v.is_short; });
        var focusedId = focusedVideo() && focusedVideo().video_id;
        clearSection("cont");
        list.forEach(function (v) { addItem("cont", v); });
        // Like the web client: a video on the Continue shelf is not repeated below.
        var ids = continueIds();
        for (var i = sections.grid.items.length - 1; i >= 0; i--) {
          if (ids[sections.grid.items[i].video_id]) removeAt("grid", i, true);
        }
        updateChrome();
        restoreFocus(focusedId);
      }).catch(function () {});
    }

    function loadMore() {
      if (loading || !hasMore) return Promise.resolve();
      loading = true;
      var gen = generation;
      return api("/feed?page=" + page)
        .then(function (data) {
          if (gen !== generation) return;
          var batch = (data && data.videos) || [];
          hasMore = batch.length === PAGE_SIZE;
          page += 1;
          var ids = continueIds();
          var first = page === 1;
          batch.filter(playable).forEach(function (v) { if (!ids[v.video_id]) addItem("grid", v); });
          loading = false;
          updateChrome();
          if (first && !current) {
            if (hasSection("cont")) setFocus("cont", 0, true);
            else if (hasSection("grid")) setFocus("grid", 0, true);
          }
        })
        .catch(function (error) {
          loading = false;
          if (String(error && error.message) === "unauthenticated" || gen !== generation) return;
          if (!hasSection("grid") && !hasSection("cont")) {
            messageEl.textContent = "Kunne ikke hente videoer. Prøver igen…";
            messageEl.hidden = false;
          }
          setTimeout(loadMore, 10000);
        });
    }

    function reloadAll() {
      generation += 1;
      clearSection("grid");
      page = 0;
      hasMore = true;
      loading = false;
      focus = { s: "grid", i: 0 };
      window.scrollTo(0, 0);
      return loadContinue().then(loadMore);
    }

    // ---------- Focus ----------

    function focusedVideo() {
      var sec = sections[focus.s];
      return sec && sec.items[focus.i];
    }

    function setFocus(sectionName, index, quiet) {
      var sec = sections[sectionName];
      if (!sec.cards.length) return;
      index = Math.max(0, Math.min(sec.cards.length - 1, index));
      var old = sections[focus.s] && sections[focus.s].cards[focus.i];
      if (old) old.classList.remove("focused");
      focus = { s: sectionName, i: index };
      var card = sec.cards[index];
      card.classList.add("focused");
      if (!quiet) {
        if (sectionName === "cont" && index < COLUMNS) window.scrollTo({ top: 0, behavior: "smooth" });
        card.scrollIntoView({ block: sectionName === "cont" ? "nearest" : "center", inline: "nearest", behavior: "smooth" });
      }
      // Fetch the next page while two rows remain below the focus.
      if (sectionName === "grid" && index >= sec.cards.length - COLUMNS * 2) loadMore();
    }

    function restoreFocus(videoId) {
      if (videoId) {
        for (var name in sections) {
          var i = sections[name].items.findIndex(function (v) { return v.video_id === videoId; });
          if (i >= 0) { setFocus(name, i, true); return; }
        }
      }
      if (sections[focus.s].cards.length) setFocus(focus.s, focus.i, true);
      else if (hasSection("cont")) setFocus("cont", 0, true);
      else if (hasSection("grid")) setFocus("grid", 0, true);
    }

    function removeAt(sectionName, index, quiet) {
      var sec = sections[sectionName];
      var card = sec.cards[index];
      if (!card) return;
      card.remove();
      sec.cards.splice(index, 1);
      sec.items.splice(index, 1);
      if (focus.s === sectionName && focus.i > index) focus.i -= 1;
      if (!quiet) restoreFocus(null);
    }

    function removeVideo(videoId) {
      removed[videoId] = true;
      ["cont", "grid"].forEach(function (name) {
        var i = sections[name].items.findIndex(function (v) { return v.video_id === videoId; });
        if (i >= 0) removeAt(name, i, true);
      });
      if (!sections[focus.s].cards.length) focus = { s: hasSection("grid") ? "grid" : "cont", i: 0 };
      updateChrome();
      restoreFocus(null);
    }

    function browseKey(code) {
      var i = focus.i;
      if (focus.s === "cont") {
        switch (code) {
          case KEY.LEFT: setFocus("cont", i - 1); return true;
          case KEY.RIGHT: setFocus("cont", i + 1); return true;
          case KEY.UP: window.scrollTo({ top: 0, behavior: "smooth" }); return true;
          case KEY.DOWN: if (hasSection("grid")) setFocus("grid", Math.min(i, COLUMNS - 1)); return true;
        }
      } else {
        var n = sections.grid.cards.length;
        switch (code) {
          case KEY.LEFT: if (i % COLUMNS > 0) setFocus("grid", i - 1); return true;
          case KEY.RIGHT: if (i % COLUMNS < COLUMNS - 1 && i + 1 < n) setFocus("grid", i + 1); return true;
          case KEY.UP:
            if (i >= COLUMNS) setFocus("grid", i - COLUMNS);
            else if (hasSection("cont")) setFocus("cont", Math.min(i, sections.cont.cards.length - 1));
            else window.scrollTo({ top: 0, behavior: "smooth" });
            return true;
          case KEY.DOWN:
            if (i + COLUMNS < n) setFocus("grid", i + COLUMNS);
            else if (Math.floor(i / COLUMNS) < Math.floor((n - 1) / COLUMNS)) setFocus("grid", n - 1);
            return true;
        }
      }
      if (code === KEY.ENTER || code === KEY.PLAY || code === KEY.PLAY_PAUSE) { openPlayer(); return true; }
      return false;
    }

    // ---------- Number keys ----------

    var busy = false;

    function actOn(kind) {
      var v = current || focusedVideo();
      if (!v || busy) return;
      busy = true;
      var path = "/videos/" + encodeURIComponent(v.video_id) + (kind === "reject" ? "/archive" : "/complete");
      post(path).then(function () {
        toast(kind === "reject" ? "Afvist" : "Markeret som set");
        if (current === v) history.back(); // close the player; the video leaves the lists below
        removeVideo(v.video_id);
      }).catch(function (error) {
        if (String(error && error.message) !== "unauthenticated") toast("Det lykkedes ikke – prøv igen");
      }).then(function () { busy = false; });
    }

    var refreshing = false;
    function refresh() {
      if (refreshing || current) return;
      refreshing = true;
      toast("Opdaterer…", 0);
      // Ask the server to check the subscriptions first, then reload what is shown.
      post("/refresh").then(function (r) {
        return reloadAll().then(function () {
          var added = r && typeof r.added === "number" ? r.added : 0;
          toast(added ? "Opdateret · " + added + (added === 1 ? " ny video" : " nye videoer") : "Opdateret · ingen nye videoer");
        });
      }).catch(function (error) {
        if (String(error && error.message) === "unauthenticated") return;
        // The check failed, but the lists can still be refreshed.
        return reloadAll().then(function () { toast("Opdateret"); });
      }).then(function () { refreshing = false; });
    }

    function numberKey(code) {
      switch (code) {
        case KEY.ONE: case KEY.NUM_ONE: actOn("reject"); return true;
        case KEY.TWO: case KEY.NUM_TWO: actOn("watched"); return true;
        case KEY.THREE: case KEY.NUM_THREE: refresh(); return true;
      }
      return false;
    }

    // ---------- Player ----------

    var player = null;
    var current = null;
    var overlayTimer = null;
    var flashTimer = null;
    var tickTimer = null;
    var lastSaved = 0;
    var captionsStarted = false;

    var ytReady = null;
    function loadYouTube() {
      if (ytReady) return ytReady;
      ytReady = new Promise(function (resolve) {
        if (window.YT && window.YT.Player) return resolve();
        window.onYouTubeIframeAPIReady = function () { resolve(); };
        var s = document.createElement("script");
        s.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(s);
      });
      return ytReady;
    }

    function fmt(seconds) {
      seconds = Math.max(0, Math.floor(seconds || 0));
      var h = Math.floor(seconds / 3600), m = Math.floor(seconds % 3600 / 60), s = seconds % 60;
      var mm = h ? String(m).padStart(2, "0") : String(m);
      return (h ? h + ":" : "") + mm + ":" + String(s).padStart(2, "0");
    }

    function position() { try { return player.getCurrentTime() || 0; } catch (e) { return 0; } }
    function duration() { try { return player.getDuration() || 0; } catch (e) { return 0; } }
    function isPlaying() { try { return player.getPlayerState() === 1; } catch (e) { return false; } }

    function updateOverlay() {
      var d = duration(), p = position();
      document.getElementById("barFill").style.width = d ? Math.min(100, p / d * 100) + "%" : "0";
      document.getElementById("time").textContent = fmt(p) + " / " + fmt(d);
    }

    function showOverlay(stay) {
      updateOverlay();
      overlayEl.classList.add("show");
      clearTimeout(overlayTimer);
      if (!stay) overlayTimer = setTimeout(function () { if (isPlaying()) overlayEl.classList.remove("show"); }, 3500);
    }

    function flash(text) {
      flashEl.textContent = text;
      flashEl.classList.add("show");
      clearTimeout(flashTimer);
      flashTimer = setTimeout(function () { flashEl.classList.remove("show"); }, 900);
    }

    // cc_load_policy=0 is not "off": YouTube restores a remembered caption track,
    // so the captions module is unloaded on ready, on first play and once after.
    function captionsOff() {
      try { player.unloadModule("captions"); } catch (e) {}
      try { player.unloadModule("cc"); } catch (e) {}
    }

    function saveProgress(keepalive) {
      if (!current || !player) return Promise.resolve();
      var p = position(), d = duration();
      if (!d || p < 1) return Promise.resolve();
      lastSaved = p;
      current.watch_position = p;
      current.watch_duration = d;
      return fetch("/api/videos/" + encodeURIComponent(current.video_id) + "/progress", {
        method: "PUT", credentials: "same-origin", keepalive: !!keepalive,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ position: p, duration: d })
      }).catch(function () {});
    }

    function openPlayer() {
      var v = focusedVideo();
      if (!v || current) return;
      current = v;
      captionsStarted = false;
      errorEl.hidden = true;
      document.getElementById("ovChannel").textContent = v.channel_title || "";
      document.getElementById("ovTitle").textContent = v.title || "";
      playerEl.hidden = false;
      document.body.classList.add("playing");
      showOverlay(true);
      // Back closes the player through history, which is what the LG remote's
      // Back button does in a webOS web app.
      history.pushState({ tvPlayer: true }, "");
      // A history row is what puts the video on the "Continue watching" shelf.
      post("/videos/" + encodeURIComponent(v.video_id) + "/watch").catch(function () {});

      var start = 0;
      if (v.watch_position && v.watch_duration && v.watch_position > 10 && v.watch_position < v.watch_duration - 30) {
        start = Math.floor(v.watch_position);
      }

      loadYouTube().then(function () {
        if (current !== v) return;
        var mount = document.createElement("div");
        document.getElementById("frame").appendChild(mount);
        player = new YT.Player(mount, {
          host: "https://www.youtube-nocookie.com",
          videoId: v.video_id,
          width: "100%", height: "100%",
          playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, iv_load_policy: 3,
                        cc_load_policy: 0, playsinline: 1, start: start, origin: location.origin },
          events: {
            onReady: function (e) {
              try { e.target.getIframe().setAttribute("tabindex", "-1"); } catch (err) {}
              captionsOff();
              e.target.playVideo();
            },
            onStateChange: function (e) {
              if (e.data === 1) {
                if (!captionsStarted) { captionsStarted = true; captionsOff(); setTimeout(captionsOff, 1500); }
                showOverlay(false);
              } else if (e.data === 2) {
                showOverlay(true);
              } else if (e.data === 0) {
                post("/videos/" + encodeURIComponent(v.video_id) + "/complete").catch(function () {});
                finished = v.video_id;
                history.back();
              }
            },
            onError: function () {
              errorEl.textContent = "Videoen kan ikke afspilles her. Tryk Back for at gå tilbage.";
              errorEl.hidden = false;
            }
          }
        });
        tickTimer = setInterval(function () {
          if (overlayEl.classList.contains("show")) updateOverlay();
          if (isPlaying() && Math.abs(position() - lastSaved) >= 15) saveProgress(false);
        }, 1000);
      });
    }

    var finished = null;

    function closePlayer() {
      if (!current) return;
      // A video just marked watched, rejected or played to the end must not get
      // a fresh position, or it would land on the Continue shelf again.
      var saved = !removed[current.video_id] && finished !== current.video_id ? saveProgress(true) : Promise.resolve();
      clearInterval(tickTimer);
      clearTimeout(overlayTimer);
      try { player && player.destroy(); } catch (e) {}
      player = null;
      current = null;
      lastSaved = 0;
      document.getElementById("frame").innerHTML = "";
      overlayEl.classList.remove("show");
      playerEl.hidden = true;
      document.body.classList.remove("playing");
      if (finished) { removeVideo(finished); finished = null; }
      restoreFocus(null);
      // What was just watched now belongs on (or moves within) the Continue shelf,
      // once its new position is stored.
      saved.then(loadContinue);
    }

    function togglePlay() {
      if (!player) return;
      if (isPlaying()) { player.pauseVideo(); flash("❚❚"); }
      else { player.playVideo(); flash("▶"); }
    }

    function seek(delta) {
      if (!player) return;
      var d = duration();
      var target = Math.max(0, position() + delta);
      if (d) target = Math.min(target, Math.max(0, d - 1));
      player.seekTo(target, true);
      flash(delta > 0 ? "+" + delta + " s" : "−" + Math.abs(delta) + " s");
      showOverlay(!isPlaying());
    }

    var backTimer = null;

    function playerKey(code) {
      switch (code) {
        case KEY.RIGHT: case KEY.FF: seek(SEEK_FORWARD); return true;
        case KEY.LEFT: case KEY.RW: seek(-SEEK_BACK); return true;
        case KEY.ENTER: case KEY.PLAY_PAUSE: togglePlay(); return true;
        case KEY.PLAY: if (!isPlaying()) togglePlay(); return true;
        case KEY.PAUSE: if (isPlaying()) togglePlay(); return true;
        case KEY.UP: case KEY.DOWN: showOverlay(false); return true;
        case KEY.BACK:
          // webOS may already turn Back into history.back() itself; only step
          // back here if that did not happen, or Back would leave the app.
          clearTimeout(backTimer);
          backTimer = setTimeout(function () { if (current) history.back(); }, 300);
          return true;
        case KEY.ESC: case KEY.BACKSPACE: case KEY.STOP: history.back(); return true;
      }
      return false;
    }

    document.getElementById("clickLayer").addEventListener("click", togglePlay);
    window.addEventListener("popstate", function () { clearTimeout(backTimer); closePlayer(); });

    document.addEventListener("keydown", function (e) {
      var handled = numberKey(e.keyCode) || (current ? playerKey(e.keyCode) : browseKey(e.keyCode));
      if (handled) e.preventDefault();
    });

    window.addEventListener("pagehide", function () { saveProgress(true); });

    loadContinue().then(loadMore);
  })();
  </script>
</body>
</html>
