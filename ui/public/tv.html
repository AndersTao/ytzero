<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <meta name="robots" content="noindex">
  <title>YT Zero</title>
  <!--
    A view-only television page, the same places as the Apple TV app: Main
    ("Continue watching" and the feed by day), Recommendations, Shorts (a row of
    upright cards per day), Scheduled (with the times to move a video to) and the
    profile's playlists, and a full-screen player. Remote keys only:
      browse  arrows move, OK plays, OK held opens a menu (watched / reject),
              Up from the top row reaches the place button at the left (choose
              where to be), Right from it the profile button (switch profile, add
              one by pairing again) and Refresh, Back goes to Main and from there
              leaves the app
      player  Right +30 s, Left −15 s, OK (or a click) pauses/plays, Back returns
      numbers 1 rejects, 2 marks as watched, 3 refreshes: shortcuts, not shown.
              (The colour keys are taken by the LG TV itself.)
    It talks to the same API as the web client, with the session cookie the TV
    login page (/tv-login.html) sets.
  -->
  <style>
    :root { --bg: #0f0f0f; --fg: #f1f1f1; --muted: #a9a9a9; --accent: #3ea6ff; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: "LG Smart UI", "Museo Sans", system-ui, sans-serif; }
    body { overflow-x: hidden; }
    body.playing { overflow: hidden; }

    #topbar { display: flex; justify-content: flex-end; padding: 32px 80px 0; }
    #refreshBtn {
      font: inherit; font-size: 24px; font-weight: 600; color: #d6d6d6; background: #272727;
      border: 0; border-radius: 999px; padding: 12px 30px; cursor: pointer; outline: none;
      display: inline-flex; align-items: center; gap: 10px;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    /* Drawn, not a character: the TV's font has no ⟳ and showed a box. */
    #refreshBtn svg { width: 24px; height: 24px; }
    #refreshBtn.focused { background: #3a3a3a; color: var(--fg); box-shadow: 0 0 0 4px var(--accent); transform: scale(1.06); }
    #topbar { gap: 20px; }
    #profileBtn {
      font: inherit; font-size: 24px; font-weight: 600; color: #d6d6d6; background: #272727;
      border: 0; border-radius: 999px; padding: 6px 28px 6px 6px; cursor: pointer; outline: none;
      display: inline-flex; align-items: center; gap: 14px;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    #profileBtn[hidden] { display: none; }
    #profileBtn.focused { background: #3a3a3a; color: var(--fg); box-shadow: 0 0 0 4px var(--accent); transform: scale(1.06); }
    .avatar {
      flex: none; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: #555;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700; color: #fff;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    #profiles { position: fixed; inset: 0; z-index: 16; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.78); }
    #profiles[hidden] { display: none; }
    #profilesBox { width: 760px; padding: 40px 44px 32px; border-radius: 26px; background: #1f1f1f; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
    #profilesTitle { margin: 0 8px 24px; font-size: 32px; font-weight: 600; }
    #profilesHint { margin: -12px 8px 24px; font-size: 24px; line-height: 1.35; color: var(--muted); }
    #profilesHint:empty { display: none; }
    .profile-item {
      display: flex; align-items: center; gap: 22px; width: 100%; margin: 0 0 10px; padding: 16px 24px; border: 0; border-radius: 16px;
      font: inherit; font-size: 30px; font-weight: 600; text-align: left; color: var(--fg); background: transparent;
      cursor: pointer; outline: none;
    }
    .profile-item .avatar { width: 56px; height: 56px; font-size: 28px; }
    .profile-item .note { margin-left: auto; font-size: 22px; font-weight: 600; color: var(--muted); }
    .profile-item.action { padding-left: 28px; }
    .profile-item.focused { background: #333; box-shadow: inset 0 0 0 4px var(--accent); }
    .profile-item.danger.focused { box-shadow: inset 0 0 0 4px #e5484d; }
    #pinRow { display: flex; gap: 16px; justify-content: center; margin: 12px 0 32px; }
    .pin-digit {
      width: 84px; height: 108px; border-radius: 16px; background: #2b2b2b;
      display: flex; align-items: center; justify-content: center;
      font-size: 56px; font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .pin-digit.focused { box-shadow: inset 0 0 0 4px var(--accent); background: #333; }
    #pinRow[hidden] { display: none; }

    #menu { position: fixed; inset: 0; z-index: 15; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.72); }
    #menu[hidden] { display: none; }
    #menuBox { width: 680px; padding: 40px 44px 32px; border-radius: 26px; background: #1f1f1f; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
    #menuTitle {
      margin: 0 8px 28px; font-size: 28px; line-height: 1.3; color: var(--muted);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .menu-item {
      display: block; width: 100%; margin: 0 0 10px; padding: 20px 28px; border: 0; border-radius: 16px;
      font: inherit; font-size: 32px; font-weight: 600; text-align: left; color: var(--fg); background: transparent;
      cursor: pointer; outline: none;
    }
    .menu-item[hidden] { display: none; }
    .menu-item.focused { background: #333; box-shadow: inset 0 0 0 4px var(--accent); }

    .section-title { margin: 8px 80px 0; font-size: 28px; font-weight: 600; color: #d6d6d6; }
    .section-title[hidden], #continueRow[hidden] { display: none; }
    /* The main list is cut into days, each under its name with a rule to the edge. */
    .day-title {
      grid-column: 1 / -1; display: flex; align-items: center; gap: 28px; margin-bottom: -24px;
      font-size: 28px; font-weight: 600; color: #d6d6d6;
    }
    .day-title::after { content: ""; flex: 1; height: 2px; border-radius: 1px; background: rgba(255,255,255,.18); }
    #continueRow {
      position: relative; display: flex; gap: 40px; overflow-x: auto; scrollbar-width: none;
      padding: 28px 80px 36px; scroll-padding: 0 80px;
    }
    #continueRow::-webkit-scrollbar { display: none; }
    #continueRow .card { flex: 0 0 calc((1920px - 160px - 120px) / 4); }
    #grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 56px 40px;
      padding: 28px 80px 120px;
    }
    .card { outline: none; border-radius: 18px; transition: transform .15s ease; }
    .thumb {
      position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #1c1c1c;
      box-shadow: 0 0 0 0 transparent; transition: box-shadow .15s ease;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .badge {
      position: absolute; top: 12px; left: 12px; padding: 4px 12px; border-radius: 8px;
      font-size: 20px; font-weight: 700; letter-spacing: .02em; color: #fff; background: rgba(0,0,0,.75);
    }
    .badge.live { background: #e5484d; }
    .duration {
      position: absolute; right: 12px; bottom: 12px; padding: 2px 10px; border-radius: 6px;
      font-size: 20px; font-weight: 600; color: #fff; background: rgba(0,0,0,.8);
    }
    .progress ~ .duration { bottom: 22px; }
    .progress { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,.3); }
    .progress div { height: 100%; background: #e5484d; }
    .card.focused { transform: scale(1.06); }
    .card.focused .thumb { box-shadow: 0 0 0 5px var(--accent); }
    .channel { margin: 16px 4px 4px; font-size: 22px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title {
      margin: 0 4px; font-size: 26px; line-height: 1.3; font-weight: 600;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    #message { padding: 160px 80px; text-align: center; font-size: 36px; color: var(--muted); }
    #message[hidden], #player[hidden], #grid[hidden] { display: none; }

    #toast {
      position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 20;
      padding: 18px 40px; border-radius: 999px; background: rgba(40,40,40,.95); font-size: 28px;
      opacity: 0; transition: opacity .25s ease; pointer-events: none;
    }
    #toast.show { opacity: 1; }

    #player { position: fixed; inset: 0; background: #000; z-index: 10; }
    #frame, #frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    /* The iframe never takes focus or clicks, so the remote's keys stay with this page. */
    #frame { pointer-events: none; }
    #clickLayer { position: absolute; inset: 0; cursor: pointer; }
    #overlay {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 120px 96px 72px;
      background: linear-gradient(transparent, rgba(0,0,0,.85));
      opacity: 0; transition: opacity .3s ease; pointer-events: none;
    }
    #overlay.show { opacity: 1; }
    #ovChannel { font-size: 26px; color: #d0d0d0; }
    #ovTitle { font-size: 40px; font-weight: 600; margin: 6px 0 28px; }
    #bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.25); overflow: hidden; }
    #barFill { height: 100%; width: 0; background: var(--accent); }
    #time { margin-top: 14px; font-size: 26px; color: #d0d0d0; font-variant-numeric: tabular-nums; }
    #flash {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      padding: 22px 44px; border-radius: 20px; background: rgba(0,0,0,.6);
      font-size: 48px; font-weight: 700; opacity: 0; transition: opacity .25s ease; pointer-events: none;
    }
    #flash.show { opacity: 1; }
    #playerError { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 36px; padding: 0 200px; }
    #playerError[hidden] { display: none; }

    /* The place button at the left of the top row: where this is, and the way elsewhere. */
    #placeBtn {
      margin-right: auto; font: inherit; font-size: 26px; font-weight: 700; color: #d6d6d6; background: #272727;
      border: 0; border-radius: 999px; padding: 12px 30px 12px 24px; cursor: pointer; outline: none;
      display: inline-flex; align-items: center; gap: 14px;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    #placeBtn svg { width: 28px; height: 28px; }
    #placeBtn.focused { background: #3a3a3a; color: var(--fg); box-shadow: 0 0 0 4px var(--accent); transform: scale(1.06); }
    #places { position: fixed; inset: 0; z-index: 16; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.78); }
    #places[hidden] { display: none; }
    #placesBox { width: 760px; max-height: 920px; overflow-y: auto; padding: 40px 44px 32px; border-radius: 26px; background: #1f1f1f; box-shadow: 0 30px 80px rgba(0,0,0,.6); scrollbar-width: none; }
    #placesBox::-webkit-scrollbar { display: none; }
    #placesTitle { margin: 0 8px 16px; font-size: 32px; font-weight: 600; }
    .places-heading { margin: 22px 8px 12px; font-size: 22px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .profile-item svg { flex: none; width: 34px; height: 34px; }
    .profile-item .count { margin-left: auto; font-size: 22px; color: var(--muted); }

    /* Shorts: a row a day of upright cards, the words on the picture. */
    #rows { padding: 12px 0 120px; }
    #rows[hidden] { display: none; }
    .rows-title { display: flex; align-items: center; gap: 28px; margin: 28px 80px 0; font-size: 28px; font-weight: 600; color: #d6d6d6; }
    .rows-title::after { content: ""; flex: 1; height: 2px; border-radius: 1px; background: rgba(255,255,255,.18); }
    .rows-title svg { width: 30px; height: 30px; color: var(--muted); }
    .short-row { display: flex; gap: 32px; overflow-x: auto; scrollbar-width: none; padding: 28px 80px 36px; scroll-padding: 0 80px; }
    .short-row::-webkit-scrollbar { display: none; }
    .card.tall { flex: 0 0 calc((1920px - 160px - 5 * 32px) / 6); }
    .card.tall .thumb { aspect-ratio: 9 / 16; border-radius: 18px; }
    .card.tall .thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0,0,0,.85)); }
    .short-caption { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 18px 18px 20px; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
    .short-caption .title { margin: 0 0 10px; font-size: 24px; }
    .short-channel { display: flex; align-items: center; gap: 10px; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .short-channel img { flex: none; width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .short-meta { margin-top: 6px; font-size: 18px; color: rgba(255,255,255,.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Scheduled: a row a video, as the web lists it, with the times to move it to. */
    .sched-row { display: flex; align-items: center; gap: 32px; margin: 0 80px; padding: 22px 0; border-bottom: 2px solid rgba(255,255,255,.08); }
    .sched-row .card { flex: 0 0 300px; }
    .sched-row .card .channel, .sched-row .card .title { display: none; }
    .sched-info { flex: 1; min-width: 0; }
    .sched-info .title { margin: 0 0 8px; }
    .sched-info .channel, .sched-info .due { margin: 0 0 4px; font-size: 22px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sched-row.focused .card .thumb { box-shadow: 0 0 0 5px var(--accent); }
    .sched-row.focused .card.focused { transform: scale(1.04); }
    .sched-picker { display: flex; align-items: flex-end; gap: 22px; }
    .sched-group { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .sched-group span { font-size: 20px; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .sched-group div { display: flex; gap: 8px; padding: 6px; border-radius: 16px; background: #222; }
    .sched-btn {
      width: 64px; height: 56px; border: 0; border-radius: 12px; background: transparent; color: #d6d6d6;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer; outline: none;
    }
    .sched-btn svg { width: 30px; height: 30px; }
    .sched-btn.wide { width: 104px; }
    .sched-btn.chosen { background: rgba(62,166,255,.28); color: var(--accent); }
    .sched-btn.focused { box-shadow: 0 0 0 4px var(--accent); background: #3a3a3a; color: var(--fg); }
    .sched-btn.remove { width: 60px; height: 60px; border-radius: 50%; background: #2a2a2a; }
    .sched-btn.remove.focused { box-shadow: 0 0 0 4px #e5484d; }
    /* The launch screen the TV app opens on, held until there is something to show. */
    #splash {
      position: fixed; inset: 0; z-index: 30; background: #2a5ef6;
      display: flex; align-items: center; justify-content: center; transition: opacity .3s ease;
    }
    #splash svg { width: 135px; height: 150px; margin-left: 14px; }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="splash"><svg viewBox="0 0 135 150" aria-hidden="true"><path d="M20 10 L125 75 L20 140 Z" fill="#fff" stroke="#fff" stroke-width="20" stroke-linejoin="round"/></svg></div>
  <div id="topbar"><button id="placeBtn" type="button" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span id="placeName">Main</span></button><button id="profileBtn" type="button" tabindex="-1" hidden><span class="avatar" id="profileAvatar"></span><span id="profileName"></span></button><button id="refreshBtn" type="button" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>Opdater</button></div>
  <div id="continueTitle" class="section-title" hidden>Fortsæt med at se</div>
  <div id="continueRow" role="list" hidden></div>
  <div id="grid" role="list"></div>
  <div id="rows" hidden></div>
  <div id="message">Henter videoer…</div>
  <div id="toast" role="status"></div>

  <div id="menu" role="dialog" aria-modal="true" hidden>
    <div id="menuBox">
      <div id="menuTitle"></div>
      <button class="menu-item" type="button" tabindex="-1" data-act="watched">Markér som set</button>
      <button class="menu-item" type="button" tabindex="-1" data-act="unschedule">Fjern fra Planlagt</button>
      <button class="menu-item" type="button" tabindex="-1" data-act="reject">Afvis</button>
      <button class="menu-item" type="button" tabindex="-1" data-act="cancel">Annuller</button>
    </div>
  </div>

  <div id="places" role="dialog" aria-modal="true" hidden>
    <div id="placesBox">
      <div id="placesTitle">Gå til</div>
      <div id="placesList"></div>
    </div>
  </div>

  <div id="profiles" role="dialog" aria-modal="true" hidden>
    <div id="profilesBox">
      <div id="profilesTitle"></div>
      <div id="profilesHint"></div>
      <div id="pinRow" hidden></div>
      <div id="profilesList"></div>
    </div>
  </div>

  <div id="player" hidden>
    <div id="frame"></div>
    <div id="clickLayer"></div>
    <div id="overlay">
      <div id="ovChannel"></div>
      <div id="ovTitle"></div>
      <div id="bar"><div id="barFill"></div></div>
      <div id="time"></div>
    </div>
    <div id="flash"></div>
    <div id="playerError" hidden></div>
  </div>

  <script>
  (function () {
    "use strict";

    var COLUMNS = 4;
    var PAGE_SIZE = 40;
    var SEEK_FORWARD = 30;
    var SEEK_BACK = 15;
    var KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, ENTER: 13, BACK: 461, ESC: 27, BACKSPACE: 8,
                PLAY: 415, PAUSE: 19, PLAY_PAUSE: 10252, FF: 417, RW: 412, STOP: 413,
                ONE: 49, TWO: 50, THREE: 51, NUM_ONE: 97, NUM_TWO: 98, NUM_THREE: 99 };

    var gridEl = document.getElementById("grid");
    var continueEl = document.getElementById("continueRow");
    var messageEl = document.getElementById("message");
    var playerEl = document.getElementById("player");
    var overlayEl = document.getElementById("overlay");
    var flashEl = document.getElementById("flash");
    var toastEl = document.getElementById("toast");
    var errorEl = document.getElementById("playerError");
    var refreshBtn = document.getElementById("refreshBtn");
    var menuEl = document.getElementById("menu");
    var menuItems = Array.prototype.slice.call(menuEl.querySelectorAll(".menu-item"));

    // Two sections of cards; focus is a section plus an index into it, or "top"
    // for the Refresh button above them.
    var sections = {
      cont: { el: continueEl, items: [], cards: [] },
      grid: { el: gridEl, items: [], cards: [] }
    };
    var focus = { s: "grid", i: 0 };
    var page = 0;
    var hasMore = true;
    var loading = false;
    var generation = 0; // bumps on refresh, so late answers from before it are dropped
    // Rejected or watched here: kept out even if a list fetched later still has them.
    var removed = {};

    // The launch screen goes once the first list is drawn (or could not be),
    // so opening the app goes from blue straight to the videos.
    var splashEl = document.getElementById("splash");
    function hideSplash() {
      if (!splashEl || splashEl.classList.contains("gone")) return;
      splashEl.classList.add("gone");
      setTimeout(function () { splashEl.hidden = true; }, 350);
    }
    setTimeout(hideSplash, 8000); // never longer than this

    var rowsEl = document.getElementById("rows");
    var placeBtn = document.getElementById("placeBtn");
    // Where this is: Main, or one of the places the place button leads to.
    var MAIN = { kind: "main", name: "Main" };
    var place = MAIN;
    var shortRows = []; // Shorts: the names of the day rows ("d0", "d1", …), top to bottom
    var schedCol = 0; // Scheduled: 0 the video, 1–5 the times to move it to, 6 remove

    // ---------- API ----------

    function api(path, options) {
      return fetch("/api" + path, Object.assign({ credentials: "same-origin", cache: "no-store" }, options || {}))
        .then(function (r) {
          if (r.status === 401) { window.location.replace("/tv-login.html"); throw new Error("unauthenticated"); }
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.status === 204 ? null : r.json().catch(function () { return null; });
        });
    }

    function post(path) { return api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }); }

    function thumbUrl(url) {
      if (!url) return "/nothumbnail.jpg";
      return /^https?:\/\//.test(url) ? "/api/img?u=" + encodeURIComponent(url) : url;
    }

    // "12:34" or "1:02:03" as the server stores it; "" for a live stream, a
    // short or a length it does not know.
    function durationText(v) {
      if (!v.duration || v.is_short || v.live_status === "live" || v.live_status === "upcoming") return "";
      var parts = String(v.duration).split(":");
      var seconds = 0;
      for (var i = 0; i < parts.length; i++) {
        if (!/^\s*\d+\s*$/.test(parts[i])) return "";
        seconds = seconds * 60 + Number(parts[i]);
      }
      if (!seconds) return "";
      var h = Math.floor(seconds / 3600), m = Math.floor(seconds % 3600 / 60), s = seconds % 60;
      var pad = function (n) { return n < 10 ? "0" + n : String(n); };
      return h ? h + ":" + pad(m) + ":" + pad(s) : m + ":" + pad(s);
    }

    // When the server stamped it: ISO, or SQLite's "YYYY-MM-DD HH:MM:SS" in UTC.
    function parseStamp(text) {
      if (!text) return null;
      var t = String(text).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(t)) t += "T12:00:00Z";
      t = t.replace(" ", "T");
      if (!/[zZ]|[+-]\d\d(:?\d\d)?$/.test(t)) t += "Z";
      var d = new Date(t);
      return isNaN(d.getTime()) ? null : d;
    }

    // "for 1 t. siden", as the web client says it in Danish. Written out rather
    // than Intl.RelativeTimeFormat, which older webOS browsers lack.
    function publishedAgo(v) {
      var at = parseStamp(v.published_at);
      if (!at) return "";
      var now = new Date();
      var minutes = Math.floor((now.getTime() - at.getTime()) / 60000);
      if (minutes < 1) return "lige nu";
      if (minutes < 60) return "for " + minutes + " min. siden";
      var hours = Math.floor(minutes / 60);
      if (hours < 24) return "for " + hours + " t. siden";
      var days = Math.floor(hours / 24);
      if (days < 30) return "for " + days + " " + (days === 1 ? "dag" : "dage") + " siden";
      var months = (now.getUTCFullYear() - at.getUTCFullYear()) * 12 + now.getUTCMonth() - at.getUTCMonth();
      if (now.getUTCDate() < at.getUTCDate()) months--;
      months = Math.max(1, months);
      if (months < 12) return "for " + months + " " + (months === 1 ? "md." : "mdr.") + " siden";
      return "for " + Math.floor(months / 12) + " år siden";
    }

    // Calendar days back from today for when a video came out: 0 today, 1–6
    // the days before, 7 for a week or more ago (or no date at all).
    var DAYS = 7;
    var WEEKDAYS = ["Søndag", "Mandag", "Tirsdag", "Onsdag", "Torsdag", "Fredag", "Lørdag"];
    function dayIndex(v) {
      var at = parseStamp(v.published_at);
      if (!at) return DAYS;
      var now = new Date();
      var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var then = new Date(at.getFullYear(), at.getMonth(), at.getDate());
      var back = Math.round((today - then) / 86400000);
      return Math.max(0, Math.min(DAYS, back));
    }
    function dayTitle(index) {
      if (index === 0) return "I dag";
      if (index >= DAYS) return "Ældre";
      var day = new Date();
      day.setDate(day.getDate() - index);
      return WEEKDAYS[day.getDay()];
    }

    // The grid in the rows it is drawn in: each day starts a row of its own,
    // so moving up and down follows those rows rather than steps of four.
    function gridRows() {
      var rows = [], row = null, last = null, items = sections.grid.items, byDay = place.kind === "main";
      for (var k = 0; k < items.length; k++) {
        var key = byDay ? dayIndex(items[k]) : 0;
        if (!row || key !== last || row.length === COLUMNS) { row = []; rows.push(row); }
        row.push(k);
        last = key;
      }
      return rows;
    }

    // Day headings go in front of the first card of each day; drawn again
    // whenever cards come or go, so a day left empty loses its heading.
    function drawDayTitles() {
      var old = gridEl.querySelectorAll(".day-title");
      for (var k = 0; k < old.length; k++) old[k].remove();
      if (place.kind !== "main") return; // elsewhere the order is the list's own
      var last = null, items = sections.grid.items, cards = sections.grid.cards;
      for (var n = 0; n < items.length; n++) {
        var key = dayIndex(items[n]);
        if (key === last) continue;
        var title = document.createElement("div");
        title.className = "day-title";
        title.setAttribute("role", "heading");
        title.textContent = dayTitle(key);
        gridEl.insertBefore(title, cards[n]);
        last = key;
      }
    }

    function playable(v) {
      return v && v.video_id && (place.kind === "playlist" || !removed[v.video_id]) && !v.is_unavailable && !v.is_private && v.live_status !== "upcoming";
    }

    var toastTimer = null;
    function toast(text, ms) {
      toastEl.textContent = text;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      if (ms !== 0) toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, ms || 2200);
    }

    // ---------- Cards and sections ----------

    function makeCard(v, sectionName) {
      var card = document.createElement("div");
      card.className = "card";
      card.setAttribute("role", "listitem");
      var thumb = document.createElement("div");
      thumb.className = "thumb";
      var img = document.createElement("img");
      img.loading = "lazy";
      img.alt = "";
      img.src = thumbUrl(v.thumbnail);
      img.onerror = function () { img.onerror = null; img.src = "/nothumbnail.jpg"; };
      thumb.appendChild(img);
      // "LIVE" on a stream that is on now, "Livestream" on a recording of one.
      if (v.live_status === "live" || v.live_status === "was_live") {
        var badge = document.createElement("div");
        badge.className = v.live_status === "live" ? "badge live" : "badge";
        badge.textContent = v.live_status === "live" ? "LIVE" : "Livestream";
        thumb.appendChild(badge);
      }
      var tall = isShortRow(sectionName);
      if (!tall && v.watch_position && v.watch_duration) {
        var bar = document.createElement("div");
        bar.className = "progress";
        var fill = document.createElement("div");
        fill.style.width = Math.min(100, v.watch_position / v.watch_duration * 100) + "%";
        bar.appendChild(fill);
        thumb.appendChild(bar);
      }
      var length = durationText(v);
      if (length) {
        var lengthEl = document.createElement("div");
        lengthEl.className = "duration";
        lengthEl.textContent = length;
        thumb.appendChild(lengthEl);
      }
      var channel = document.createElement("div");
      channel.className = "channel";
      var ago = publishedAgo(v);
      channel.textContent = (v.channel_title || "") + (ago ? " · " + ago : "");
      var title = document.createElement("div");
      title.className = "title";
      title.textContent = v.title || "";
      card.appendChild(thumb);
      if (tall) {
        card.classList.add("tall");
        thumb.appendChild(shortCaption(v));
      } else {
        card.appendChild(channel);
        card.appendChild(title);
      }
      // Look the index up when clicked: cards move as videos are removed.
      card.addEventListener("click", function () {
        if (pointerHoldFired) { pointerHoldFired = false; return; }
        var i = sections[sectionName].cards.indexOf(card);
        if (sectionName === "sched") schedCol = 0;
        if (i >= 0) { setFocus(sectionName, i); openPlayer(); }
      });
      // The Magic Remote's pointer: OK held on a card opens the menu too.
      card.addEventListener("mousedown", function () {
        clearTimeout(pointerHold);
        pointerHoldFired = false;
        pointerHold = setTimeout(function () {
          var i = sections[sectionName].cards.indexOf(card);
          if (i < 0) return;
          pointerHoldFired = true;
          setFocus(sectionName, i, true);
          openMenu();
        }, HOLD_MS);
      });
      card.addEventListener("mouseup", function () { clearTimeout(pointerHold); });
      card.addEventListener("mouseleave", function () { clearTimeout(pointerHold); });
      card.dataset.section = sectionName;
      return card;
    }

    // A Short's words on its picture, as the web draws it: title, channel, views and age.
    function shortCaption(v) {
      var caption = document.createElement("div");
      caption.className = "short-caption";
      var title = document.createElement("div");
      title.className = "title";
      title.textContent = v.title || "";
      var channel = document.createElement("div");
      channel.className = "short-channel";
      if (v.channel_thumbnail) {
        var avatar = document.createElement("img");
        avatar.alt = "";
        avatar.src = thumbUrl(v.channel_thumbnail);
        avatar.onerror = function () { avatar.remove(); };
        channel.appendChild(avatar);
      }
      channel.appendChild(document.createTextNode(v.channel_title || ""));
      var meta = document.createElement("div");
      meta.className = "short-meta";
      meta.textContent = [viewsText(v.views), publishedAgo(v)].filter(Boolean).join(" · ");
      caption.appendChild(title);
      caption.appendChild(channel);
      caption.appendChild(meta);
      return caption;
    }

    // "213 t. visninger", "1,2 mio. visninger", as Danish YouTube shortens them.
    function viewsText(views) {
      var n = Number(views);
      if (!n || n < 0) return "";
      var short = function (x) { return (x >= 100 ? String(Math.round(x)) : (Math.round(x * 10) / 10).toString().replace(".", ",")); };
      if (n >= 1e6) return short(n / 1e6) + " mio. visninger";
      if (n >= 1e3) return short(n / 1e3) + " t. visninger";
      return n + " visninger";
    }

    function isShortRow(name) { return /^d\d+$/.test(name); }

    // The Shorts row for a video's day, made the first time that day comes up.
    function shortRowFor(v) {
      var key = dayIndex(v), name = "d" + key;
      if (sections[name]) return name;
      var title = document.createElement("div");
      title.className = "rows-title";
      title.setAttribute("role", "heading");
      title.textContent = dayTitle(key);
      var row = document.createElement("div");
      row.className = "short-row";
      row.setAttribute("role", "list");
      rowsEl.appendChild(title);
      rowsEl.appendChild(row);
      sections[name] = { el: row, items: [], cards: [], title: title };
      shortRows.push(name);
      return name;
    }

    // ---------- Scheduled ----------

    var BUCKETS = ["today", "tonight", "tomorrow", "tomorrow_evening", "weekend"];
    var ICONS = {
      sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
      cup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3v3M12 3v3"/></svg>',
      x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
    };
    var PICKER = [
      { title: "I dag", buttons: [["today", "sun", "I dag"], ["tonight", "moon", "I aften"]] },
      { title: "I morgen", buttons: [["tomorrow", "sun", "I morgen"], ["tomorrow_evening", "moon", "I morgen aften"]] },
      { title: "Weekend", buttons: [["weekend", "cup", "Weekend"]] }
    ];
    var MONTHS = ["jan.", "feb.", "mar.", "apr.", "maj", "jun.", "jul.", "aug.", "sep.", "okt.", "nov.", "dec."];

    // Today (with tonight), Tomorrow (with tomorrow evening), Weekend, as the web groups them.
    function schedGroup(v) {
      var b = v.bucket || "";
      if (b === "today" || b === "tonight") return "I dag";
      if (b === "tomorrow" || b === "tomorrow_evening") return "I morgen";
      if (b === "weekend") return "Weekend";
      return "Senere";
    }

    function schedSorted(list) {
      var rank = function (v) { var k = BUCKETS.indexOf(v.bucket || ""); return k < 0 ? BUCKETS.length : k; };
      var due = function (v) { var d = parseStamp(v.show_from); return d ? d.getTime() : 0; };
      return list.slice().sort(function (a, b) { return rank(a) - rank(b) || due(a) - due(b); });
    }

    // When it is due, as the web writes it: "i dag kl. 18.00", "lørdag 28. nov. kl. 00.00".
    function dueText(v) {
      var at = parseStamp(v.show_from);
      if (!at) return "";
      var pad = function (n) { return n < 10 ? "0" + n : String(n); };
      var time = pad(at.getHours()) + "." + pad(at.getMinutes());
      var now = new Date();
      var days = Math.round((new Date(at.getFullYear(), at.getMonth(), at.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
      if (days <= 0) return "I dag kl. " + time;
      if (days === 1) return "I morgen kl. " + time;
      return WEEKDAYS[at.getDay()] + " " + at.getDate() + ". " + MONTHS[at.getMonth()] + " kl. " + time;
    }

    // A row a video: the card, what it is and when it is due, and the times to move it to.
    function schedRow(v, card) {
      var row = document.createElement("div");
      row.className = "sched-row";
      row.appendChild(card);
      var info = document.createElement("div");
      info.className = "sched-info";
      [["title", v.title], ["channel", v.channel_title], ["due", dueText(v)]].forEach(function (line) {
        var el = document.createElement("div");
        el.className = line[0];
        el.textContent = line[1] || "";
        info.appendChild(el);
      });
      row.appendChild(info);
      var picker = document.createElement("div");
      picker.className = "sched-picker";
      PICKER.forEach(function (group) {
        var g = document.createElement("div");
        g.className = "sched-group";
        var label = document.createElement("span");
        label.textContent = group.title;
        var box = document.createElement("div");
        group.buttons.forEach(function (b) {
          box.appendChild(schedButton(card, b[0], ICONS[b[1]], b[2], v.bucket === b[0], b[0] === "weekend"));
        });
        g.appendChild(label);
        g.appendChild(box);
        picker.appendChild(g);
      });
      row.appendChild(picker);
      row.appendChild(schedButton(card, null, ICONS.x, "Fjern fra Planlagt", false, false));
      return row;
    }

    function schedButton(card, bucket, icon, label, chosen, wide) {
      var b = document.createElement("button");
      b.type = "button";
      b.tabIndex = -1;
      b.className = "sched-btn" + (bucket ? "" : " remove") + (chosen ? " chosen" : "") + (wide ? " wide" : "");
      b.innerHTML = icon;
      b.setAttribute("aria-label", label);
      b.addEventListener("click", function () {
        var i = sections.sched.cards.indexOf(card);
        if (i < 0) return;
        var buttons = Array.prototype.slice.call(card.parentNode.querySelectorAll(".sched-btn"));
        schedCol = buttons.indexOf(b) + 1;
        setFocus("sched", i, true);
        schedAct(i);
      });
      return b;
    }

    function schedButtons(index) {
      var card = sections.sched.cards[index];
      return card ? Array.prototype.slice.call(card.parentNode.querySelectorAll(".sched-btn")) : [];
    }

    // The group headings, drawn again whenever rows come or go.
    function drawSchedTitles() {
      var old = rowsEl.querySelectorAll(".rows-title");
      for (var k = 0; k < old.length; k++) old[k].remove();
      var last = null, items = sections.sched.items, cards = sections.sched.cards;
      for (var n = 0; n < items.length; n++) {
        var group = schedGroup(items[n]);
        if (group === last) continue;
        var title = document.createElement("div");
        title.className = "rows-title";
        title.setAttribute("role", "heading");
        title.innerHTML = group === "Weekend" ? ICONS.cup : ICONS.sun;
        title.appendChild(document.createTextNode(group));
        rowsEl.insertBefore(title, cards[n].parentNode);
        last = group;
      }
    }

    // OK on one of the times moves the video there; on the X it leaves Scheduled.
    function schedAct(index) {
      var v = sections.sched.items[index];
      if (!v || busy) return;
      if (schedCol >= 6) { actOn("unschedule", v); return; }
      var bucket = BUCKETS[schedCol - 1];
      if (!bucket || v.bucket === bucket) return;
      busy = true;
      api("/videos/" + encodeURIComponent(v.video_id) + "/queue", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ bucket: bucket })
      }).then(function () {
        toast("Flyttet");
        return reloadAll().then(function () {
          var i = sections.sched.items.findIndex(function (x) { return x.video_id === v.video_id; });
          if (i >= 0) setFocus("sched", i);
        });
      }).catch(function (error) {
        if (String(error && error.message) !== "unauthenticated") toast("Det lykkedes ikke – prøv igen");
      }).then(function () { busy = false; });
    }

    function addItem(sectionName, v) {
      var sec = sections[sectionName];
      var card = makeCard(v, sectionName);
      sec.items.push(v);
      sec.cards.push(card);
      if (sectionName === "sched") sec.el.appendChild(schedRow(v, card));
      else sec.el.appendChild(card);
      if (sectionName === "grid") drawDayTitles();
    }

    // The sections of the place on screen, top to bottom.
    function sectionOrder() {
      if (place.kind === "main") return ["cont", "grid"];
      if (place.kind === "shorts") return shortRows.slice();
      if (place.kind === "sched") return ["sched"];
      return ["grid"];
    }

    function filledSections() { return sectionOrder().filter(hasSection); }

    // Everything but Main's two sections goes when another place is shown.
    function clearPlace() {
      clearSection("cont");
      clearSection("grid");
      Object.keys(sections).forEach(function (name) { if (name !== "cont" && name !== "grid") delete sections[name]; });
      shortRows = [];
      rowsEl.innerHTML = "";
      if (place.kind === "sched") sections.sched = { el: rowsEl, items: [], cards: [] };
    }

    function clearSection(sectionName) {
      var sec = sections[sectionName];
      sec.items = [];
      sec.cards = [];
      sec.el.innerHTML = "";
    }

    function hasSection(name) { return Boolean(sections[name]) && sections[name].cards.length > 0; }

    function emptyText() {
      switch (place.kind) {
        case "recs": return place.off ? "Anbefalinger er slået fra for denne profil" : "Ingen anbefalinger lige nu";
        case "shorts": return "Ingen Shorts endnu";
        case "sched": return "Intet er planlagt";
        case "playlist": return "Playlisten er tom";
      }
      return "Ingen nye videoer";
    }

    function updateChrome() {
      var hasCont = place.kind === "main" && hasSection("cont");
      continueEl.hidden = !hasCont;
      document.getElementById("continueTitle").hidden = !hasCont;
      var any = filledSections().length > 0;
      if (!any && !loading) {
        messageEl.textContent = emptyText();
        messageEl.hidden = false;
      } else if (any) {
        messageEl.hidden = true;
      }
    }

    function continueIds() {
      var ids = {};
      sections.cont.items.forEach(function (v) { ids[v.video_id] = true; });
      return ids;
    }

    // ---------- Loading ----------

    function loadContinue() {
      if (place.kind !== "main") return Promise.resolve();
      var gen = generation;
      return api("/in-progress").then(function (data) {
        if (gen !== generation) return;
        var list = ((data && data.videos) || []).filter(function (v) { return playable(v) && !v.is_short; });
        var focusedId = focusedVideo() && focusedVideo().video_id;
        clearSection("cont");
        list.forEach(function (v) { addItem("cont", v); });
        // Like the web client: a video on the Continue shelf is not repeated below.
        var ids = continueIds();
        for (var i = sections.grid.items.length - 1; i >= 0; i--) {
          if (ids[sections.grid.items[i].video_id]) removeAt("grid", i, true);
        }
        updateChrome();
        restoreFocus(focusedId);
      }).catch(function () {});
    }

    // One page of what the place shows; Scheduled and a playlist come whole.
    function pagePath() {
      switch (place.kind) {
        case "recs": return "/recommendations?limit=" + PAGE_SIZE + "&page=" + page + (place.fresh && page === 0 ? "&refresh=1" : "");
        case "shorts": return "/feed?only_shorts=1&limit=" + PAGE_SIZE + "&page=" + page;
        case "sched": return "/watchlist";
        case "playlist": return "/playlists/" + encodeURIComponent(place.id) + "?sort=added-newest";
      }
      return "/feed?page=" + page;
    }

    function listed(videoId) {
      for (var name in sections) {
        if (sections[name].items.some(function (v) { return v.video_id === videoId; })) return true;
      }
      return false;
    }

    function loadMore() {
      if (loading || !hasMore) return Promise.resolve();
      loading = true;
      var gen = generation;
      return api(pagePath())
        .then(function (data) {
          if (gen !== generation) return;
          var batch = (data && data.videos) || [];
          if (place.kind === "recs") {
            place.off = Boolean(data && data.enabled === false);
            hasMore = Boolean(data && data.has_more);
          } else {
            hasMore = (place.kind === "main" || place.kind === "shorts") && batch.length === PAGE_SIZE;
          }
          page += 1;
          var first = page === 1;
          var list = batch.filter(playable);
          if (place.kind === "sched") list = schedSorted(list);
          list.forEach(function (v) {
            if (listed(v.video_id)) return; // on the Continue shelf, or on an earlier page
            var name = place.kind === "shorts" ? shortRowFor(v) : place.kind === "sched" ? "sched" : "grid";
            addItem(name, v);
          });
          if (place.kind === "sched") drawSchedTitles();
          loading = false;
          updateChrome();
          hideSplash();
          if (first && !current && focus.s !== "top") {
            var firstFilled = filledSections()[0];
            if (firstFilled) setFocus(firstFilled, 0, true);
            else focusTop(true, 0); // nothing here: the way elsewhere
          }
        })
        .catch(function (error) {
          loading = false;
          hideSplash();
          if (String(error && error.message) === "unauthenticated" || gen !== generation) return;
          if (!filledSections().length) {
            messageEl.textContent = "Kunne ikke hente videoer. Prøver igen…";
            messageEl.hidden = false;
          }
          setTimeout(loadMore, 10000);
        });
    }

    function reloadAll(fresh) {
      generation += 1;
      if (place.kind === "main") clearSection("grid"); else clearPlace();
      page = 0;
      hasMore = true;
      loading = false;
      place.fresh = Boolean(fresh);
      // Refreshed from the button: stay on it.
      if (focus.s !== "top") focus = { s: "grid", i: 0 };
      window.scrollTo(0, 0);
      return loadContinue().then(loadMore);
    }

    // Another place: its own list from the top, under its name on the place button.
    function showPlace(target) {
      place = target;
      document.getElementById("placeName").textContent = target.name;
      gridEl.hidden = target.kind === "shorts" || target.kind === "sched";
      rowsEl.hidden = !gridEl.hidden;
      clearPlace();
      messageEl.textContent = "Henter videoer…";
      messageEl.hidden = false;
      updateChrome();
      // Into the new place: its first card once it is there.
      clearMark();
      focus = { s: "grid", i: 0 };
      schedCol = 0;
      reloadAll();
    }

    // ---------- Focus ----------

    function focusedVideo() {
      var sec = sections[focus.s];
      if (focus.s === "sched" && schedCol > 0) return null; // on a time, not the video
      return sec && sec.items[focus.i];
    }

    // Exactly one thing carries the mark; clear whatever had it.
    function clearMark() {
      var marked = document.querySelectorAll(".card.focused, .sched-row.focused, .sched-btn.focused, #placeBtn.focused, #refreshBtn.focused, #profileBtn.focused");
      for (var k = 0; k < marked.length; k++) marked[k].classList.remove("focused");
    }

    // The top row: the place button, the profile button (once known) and Refresh.
    // Up lands on the place button, the way to the other places.
    function topButtons() { return [placeBtn, profileBtn, refreshBtn].filter(function (b) { return !b.hidden; }); }

    function focusTop(quiet, index) {
      clearMark();
      var buttons = topButtons();
      var i = index == null || index < 0 ? 0 : Math.min(buttons.length - 1, index);
      focus = { s: "top", i: i, btn: buttons[i] };
      buttons[i].classList.add("focused");
      if (!quiet) window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function pressTop(button) {
      if (button === placeBtn) openPlaces();
      else if (button === profileBtn) openProfiles();
      else refresh();
    }

    function setFocus(sectionName, index, quiet) {
      var sec = sections[sectionName];
      if (!sec.cards.length) return;
      index = Math.max(0, Math.min(sec.cards.length - 1, index));
      clearMark();
      focus = { s: sectionName, i: index };
      var card = sec.cards[index];
      if (sectionName === "sched") {
        card.parentNode.classList.add("focused");
        var buttons = schedButtons(index);
        if (schedCol > 0 && buttons[schedCol - 1]) buttons[schedCol - 1].classList.add("focused");
        else { schedCol = 0; card.classList.add("focused"); }
      } else {
        card.classList.add("focused");
      }
      if (!quiet) {
        if (sectionName === "cont") {
          /*
           * The shelf is the top of the page: show all of it, heading included,
           * and scroll the row itself sideways. One smooth scroll per box —
           * scrollIntoView here as well cancelled the page's scroll to the top
           * and stopped it where the card first showed, under a cut-off
           * heading, so the next Up was spent finishing the scroll.
           */
          window.scrollTo({ top: 0, behavior: "smooth" });
          var left = card.offsetLeft - 80, right = card.offsetLeft + card.offsetWidth + 80;
          if (left < continueEl.scrollLeft) continueEl.scrollTo({ left: left, behavior: "smooth" });
          else if (right > continueEl.scrollLeft + continueEl.clientWidth) continueEl.scrollTo({ left: right - continueEl.clientWidth, behavior: "smooth" });
        } else {
          card.scrollIntoView({ block: "center", inline: "nearest", behavior: "smooth" });
        }
      }
      // Fetch the next page while two rows remain below the focus.
      if (sectionName === "grid" && index >= sec.cards.length - COLUMNS * 2) loadMore();
      if (isShortRow(sectionName) && sectionName === shortRows[shortRows.length - 1]) loadMore();
    }

    function restoreFocus(videoId) {
      if (videoId) {
        for (var name in sections) {
          var i = sections[name].items.findIndex(function (v) { return v.video_id === videoId; });
          if (i >= 0) { setFocus(name, i, true); return; }
        }
      }
      if (focus.s === "top") { focusTop(true, topButtons().indexOf(focus.btn)); return; }
      if (hasSection(focus.s)) { setFocus(focus.s, focus.i, true); return; }
      var filled = filledSections();
      if (filled.length) setFocus(filled[0], 0, true);
    }

    function removeAt(sectionName, index, quiet) {
      var sec = sections[sectionName];
      var card = sec.cards[index];
      if (!card) return;
      (sectionName === "sched" ? card.parentNode : card).remove();
      sec.cards.splice(index, 1);
      sec.items.splice(index, 1);
      if (sectionName === "grid") drawDayTitles();
      if (sectionName === "sched") drawSchedTitles();
      // A day of Shorts left empty loses its row and heading.
      if (sec.title && !sec.cards.length) { sec.title.hidden = true; sec.el.hidden = true; }
      if (focus.s === sectionName && focus.i > index) focus.i -= 1;
      if (!quiet) restoreFocus(null);
    }

    function removeVideo(videoId) {
      removed[videoId] = true;
      Object.keys(sections).forEach(function (name) {
        var i = sections[name].items.findIndex(function (v) { return v.video_id === videoId; });
        if (i >= 0) removeAt(name, i, true);
      });
      if (focus.s !== "top" && !hasSection(focus.s)) {
        // The next row down, or the last one there is.
        var order = sectionOrder(), at = order.indexOf(focus.s), next = null;
        for (var k = at + 1; k < order.length && !next; k++) if (hasSection(order[k])) next = order[k];
        var filled = filledSections();
        focus = { s: next || filled[filled.length - 1] || "grid", i: next ? 0 : focus.i };
      }
      updateChrome();
      restoreFocus(null);
    }

    function browseKey(code) {
      var i = focus.i;
      // Back from another place goes to Main; on Main it leaves the app.
      if (place.kind !== "main" && (code === KEY.BACK || code === KEY.ESC || code === KEY.BACKSPACE)) {
        clearTimeout(backTimer);
        var was = place;
        // As in the player: webOS may step back by itself.
        if (code === KEY.BACK) backTimer = setTimeout(function () { if (place === was && !current) history.back(); }, 300);
        else history.back();
        return true;
      }
      if (focus.s === "top") {
        switch (code) {
          case KEY.DOWN:
            var filled = filledSections();
            if (filled.length) setFocus(filled[0], 0);
            return true;
          case KEY.LEFT: focusTop(true, Math.max(0, i - 1)); return true;
          case KEY.RIGHT: focusTop(true, i + 1); return true;
          case KEY.UP: return true;
          case KEY.ENTER: pressTop(topButtons()[i]); return true;
        }
        return false;
      }
      if (focus.s === "sched") {
        switch (code) {
          case KEY.LEFT: if (schedCol > 0) { schedCol -= 1; setFocus("sched", i, true); } return true;
          case KEY.RIGHT: if (schedCol < 6) { schedCol += 1; setFocus("sched", i, true); } return true;
          case KEY.UP: if (i > 0) setFocus("sched", i - 1); else focusTop(); return true;
          case KEY.DOWN: setFocus("sched", i + 1); return true;
          case KEY.ENTER: schedAct(i); return true;
        }
      } else if (isShortRow(focus.s)) {
        var rowsShown = filledSections(), at = rowsShown.indexOf(focus.s);
        var other = function (name) { setFocus(name, Math.min(i, sections[name].cards.length - 1)); };
        switch (code) {
          case KEY.LEFT: setFocus(focus.s, i - 1); return true;
          case KEY.RIGHT: setFocus(focus.s, i + 1); return true;
          case KEY.UP: if (at > 0) other(rowsShown[at - 1]); else focusTop(); return true;
          case KEY.DOWN: if (at + 1 < rowsShown.length) other(rowsShown[at + 1]); return true;
        }
      } else if (focus.s === "cont") {
        switch (code) {
          case KEY.LEFT: setFocus("cont", i - 1); return true;
          case KEY.RIGHT: setFocus("cont", i + 1); return true;
          case KEY.UP: focusTop(); return true;
          case KEY.DOWN:
            if (hasSection("grid")) { var first = gridRows()[0]; setFocus("grid", first[Math.min(i, first.length - 1)]); }
            return true;
        }
      } else {
        var rows = gridRows(), r = 0, c = 0;
        for (var rr = 0; rr < rows.length; rr++) {

          if (at >= 0) { r = rr; c = at; break; }
        }
        var row = rows[r] || [];
        switch (code) {
          case KEY.LEFT: if (c > 0) setFocus("grid", row[c - 1]); return true;
          case KEY.RIGHT: if (c + 1 < row.length) setFocus("grid", row[c + 1]); return true;
          case KEY.UP:
            if (r > 0) setFocus("grid", rows[r - 1][Math.min(c, rows[r - 1].length - 1)]);
            else if (place.kind === "main" && hasSection("cont")) setFocus("cont", Math.min(c, sections.cont.cards.length - 1));
            else focusTop();
            return true;
          case KEY.DOWN:
            if (r + 1 < rows.length) setFocus("grid", rows[r + 1][Math.min(c, rows[r + 1].length - 1)]);

      if (code === KEY.PLAY || code === KEY.PLAY_PAUSE) { openPlayer(); return true; }

    // ---------- Hold-OK menu ----------

    var HOLD_MS = 600;

    var menuIndex = 0;
    var menuAfter = null;

    var pointerHoldFired = false;

    function menuAllows(act) {

      if (act === "reject") return place.kind !== "playlist";
      return true;
    }

    function markMenu(index) {

    function openMenu() {
      var v = focusedVideo();
      if (!v || menuOpen || current) return;
      menuOpen = true;
      menuPressed = false;
      menuVideo = v;
      document.getElementById("menuTitle").textContent = v.title || "";
      menuItems.forEach(function (b) { b.hidden = !menuAllows(b.getAttribute("data-act")); });
      menuShown = menuItems.filter(function (b) { return !b.hidden; });

      menuEl.hidden = false;

    // Close, then do what was chosen; the popstate handler runs it.
    function leaveMenu(after) {
      if (!menuOpen) return;

    }

    function closeMenu() {
      menuOpen = false;
      menuEl.hidden = true;
      var after = menuAfter, v = menuVideo;
      menuAfter = null;
      menuVideo = null;
      restoreFocus(null);
      if (after) after(v);
    }

    function chooseMenu(index) {
      var act = menuShown[index].getAttribute("data-act");

      else leaveMenu(function (v) { actOn(act, v); });
    }

    function menuKey(code) {
      switch (code) {
        case KEY.UP: markMenu(menuIndex - 1); return true;
        case KEY.DOWN: markMenu(menuIndex + 1); return true;
        case KEY.ENTER: chooseMenu(menuIndex); return true;
        case KEY.BACK:

          clearTimeout(backTimer);
          backTimer = setTimeout(function () { if (menuOpen) history.back(); }, 300);
          return true;
        case KEY.ESC: case KEY.BACKSPACE: leaveMenu(); return true;
      }
      return true; // nothing else reaches the page while the menu is open
    }

    // pointer hold that opened it must not pick or dismiss anything.
    var menuPressed = false;
    menuEl.addEventListener("mousedown", function () { menuPressed = true; }, true);
    menuItems.forEach(function (b) {
      b.addEventListener("click", function (e) { e.stopPropagation(); if (menuPressed) chooseMenu(menuShown.indexOf(b)); });
    });
    menuEl.addEventListener("click", function (e) { if (e.target === menuEl && menuPressed) leaveMenu(); });
    refreshBtn.addEventListener("click", function () { focusTop(true, topButtons().indexOf(refreshBtn)); refresh(); });
    placeBtn.addEventListener("click", function () { focusTop(true, 0); openPlaces(); });

    // ---------- Number keys ----------

    var busy = false;

    function actOn(kind, video) {
      var v = video || current || focusedVideo();
      if (!v || busy) return;
      busy = true;
      var ending = { reject: "/archive", unschedule: "/dequeue" }[kind] || "/complete";
      var done = { reject: "Afvist", unschedule: "Fjernet fra Planlagt" }[kind] || "Markeret som set";
      post("/videos/" + encodeURIComponent(v.video_id) + ending).then(function () {
        toast(done);

        removeVideo(v.video_id);
      }).catch(function (error) {
        if (String(error && error.message) !== "unauthenticated") toast("Det lykkedes ikke – prøv igen");
      }).then(function () { busy = false; });
    }

    var refreshing = false;
    function refresh() {
      if (refreshing || current) return;
      refreshing = true;
      toast("Opdaterer…", 0);
      // Ask the server to check the subscriptions first (for what they bring:
      // Main and Shorts), then reload what is shown. Recommendations are worked
      // out again instead.
      var checks = place.kind === "main" || place.kind === "shorts";
      (checks ? post("/refresh") : Promise.resolve(null)).then(function (r) {
        return reloadAll(place.kind === "recs").then(function () {
          if (!checks) { toast("Opdateret"); return; }
          var added = r && typeof r.added === "number" ? r.added : 0;
          toast(added ? "Opdateret · " + added + (added === 1 ? " ny video" : " nye videoer") : "Opdateret · ingen nye videoer");
        });
      }).catch(function (error) {
        if (String(error && error.message) === "unauthenticated") return;

    // ---------- Places ----------

    var placesEl = document.getElementById("places");
    var placesListEl = document.getElementById("placesList");
    var placesOpen = false;
    var placesOpenedAt = 0;
    var placeItems = [];
    var placeIndex = 0;
    var placesAfter = null;
    var playlists = [];
    var PLACE_ICONS = {
      main: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
      recs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>',
      shorts: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="3"/><path d="M11 9l3 3-3 3z" fill="currentColor"/></svg>',
      sched: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
      playlist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h11M4 12h11M4 18h7"/><path d="M19 6v10.5"/><circle cx="17" cy="17" r="2"/></svg>'
    };
    var PLACES = [
      MAIN,
      { kind: "recs", name: "Anbefalinger" },
      { kind: "shorts", name: "Shorts" },
      { kind: "sched", name: "Planlagt" }
    ];

    function samePlace(a, b) { return a.kind === b.kind && a.id === b.id; }

    function placeItem(target, icon, note) {
      var b = document.createElement("button");
      b.type = "button";
      b.tabIndex = -1;
      b.className = "profile-item action";
      b.innerHTML = icon;
      var text = document.createElement("span");
      text.textContent = target.name;
      b.appendChild(text);
      var extra = document.createElement("span");
      extra.className = samePlace(target, place) ? "note" : "count";
      extra.textContent = samePlace(target, place) ? "Her" : note || "";
      b.appendChild(extra);
      var run = function () { leavePlaces(function () { goPlace(target); }); };
      b.addEventListener("click", function (e) {

    function renderPlaces(keep) {

    function markPlace(index) {
      placeIndex = Math.max(0, Math.min(placeItems.length - 1, index));
      placeItems.forEach(function (item, k) { item.el.classList.toggle("focused", k === placeIndex); });
      var el = placeItems[placeIndex] && placeItems[placeIndex].el;
      if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest" });
    }

    function loadPlaylists() {
      return api("/playlists").then(function (data) {
        playlists = ((data && data.playlists) || []).map(function (p) {
          return { kind: "playlist", id: p.id, name: p.name || "", count: p.video_count || 0 };
        });
      }).catch(function () {});
    }

    function openPlaces() {
      if (placesOpen || profilesOpen || current || menuOpen) return;
      placesOpen = true;
      placesOpenedAt = Date.now();
      renderPlaces(false);
      placesEl.hidden = false;
      history.pushState({ tvPlaces: true }, "");
      // A playlist made on the web meanwhile shows up.
      loadPlaylists().then(function () { if (placesOpen) renderPlaces(true); });
    }

    // Close, then go where was chosen; the popstate handler runs it.
    function leavePlaces(after) {

    }

    function closePlaces() {
      placesOpen = false;
      placesEl.hidden = true;
      var after = placesAfter;
      placesAfter = null;
      restoreFocus(null);
      if (after) after();
    }

    function goPlace(target) {
      if (samePlace(target, place)) return;
      if (target.kind === "main") { history.back(); return; } // the row leaving Main put there

      showPlace(target);
    }

    function placesKey(code, e) {

      if (code === KEY.ENTER && (e.repeat || Date.now() - placesOpenedAt < 500)) return true;
      switch (code) {
        case KEY.BACK:
          clearTimeout(backTimer);
          backTimer = setTimeout(function () { if (placesOpen) history.back(); }, 300);
          return true;

    placesEl.addEventListener("click", function (e) { if (e.target === placesEl) leavePlaces(); });

    // ---------- Profiles ----------

    /*
     * Who is watching, and switching to another profile. Where the instance
     * lets a session switch by itself (no login, a shared login, OIDC through
     * a gateway) this is the web client's profile switch. Where each session
     * is pinned to one profile, the TV holds one session per profile, each
     * paired on its own ("Tilføj profil" runs the pairing page again), and
     * the server swaps the session cookie for another of them. Leaving a
     * child profile asks for the child lock PIN either way.
     */
    var profileBtn = document.getElementById("profileBtn");
    var profilesEl = document.getElementById("profiles");
    var profilesListEl = document.getElementById("profilesList");
    var pinRowEl = document.getElementById("pinRow");
    var profileState = { canSwitch: false, activeId: 0, profiles: [] };
    var profilesOpen = false;
    var profilesOpenedAt = 0;
    var profilesView = "list"; // list | remove | pin
    var profileItems = [];
    var profileIndex = 0;
    var profilesBusy = false;
    var pin = null; // { target, kind: "child" | "profile", childPin, digits, at, onRow }

    // Unlike api(), a 401 here is an answer (a PIN), not a lost session.
    function send(method, path, body) {
      var options = { method: method, credentials: "same-origin", cache: "no-store", headers: { "Content-Type": "application/json" } };
      if (body) options.body = JSON.stringify(body);
      return fetch("/api" + path, options).then(function (r) {
        return r.json().catch(function () { return null; }).then(function (b) { return { status: r.status, body: b || {} }; });
      });
    }

    function activeProfile() {
      for (var k = 0; k < profileState.profiles.length; k++) {
        if (profileState.profiles[k].id === profileState.activeId) return profileState.profiles[k];
      }
      return null;
    }

    function avatarEl(p, className) {
      var el = document.createElement("span");
      el.className = className || "avatar";
      el.style.background = p.color || "#555";
      var initial = document.createTextNode(String(p.name || "?").trim().charAt(0).toUpperCase() || "?");
      if (p.avatar) {
        var img = document.createElement("img");
        img.alt = "";
        img.onerror = function () { el.removeChild(img); el.appendChild(initial); };
        img.src = p.avatar;
        el.appendChild(img);
      } else {
        el.appendChild(initial);
      }
      return el;
    }

    function loadProfiles() {
      return send("GET", "/auth/status").then(function (status) {
        var canSwitch = Boolean(status.body.can_switch);
        var hideOthers = Boolean(status.body.hide_other_profiles);
        return send("GET", canSwitch ? "/profiles" : "/auth/device/profiles").then(function (r) {
          if (r.status !== 200) return;
          var activeId = r.body.active_id;
          var list = (r.body.profiles || []).map(function (p) {
            return { id: p.id, name: p.name || "", avatar: p.avatar || "", color: p.avatar_color || "", child: Boolean(p.is_child), hasPin: Boolean(p.has_pin) };
          }).filter(function (p) { return !(canSwitch && hideOthers) || p.id === activeId; });
          profileState = { canSwitch: canSwitch, activeId: activeId, profiles: list };
          var active = activeProfile();
          if (!active) return;
          var avatar = avatarEl(active);
          avatar.id = "profileAvatar";
          profileBtn.replaceChild(avatar, document.getElementById("profileAvatar"));
          document.getElementById("profileName").textContent = active.name;
          profileBtn.hidden = false;
        });
      }).catch(function () {});
    }

    function profileItem(label, run, options) {
      options = options || {};
      var b = document.createElement("button");
      b.type = "button";
      b.tabIndex = -1;
      b.className = "profile-item" + (options.profile ? "" : " action") + (options.danger ? " danger" : "");
      if (options.profile) b.appendChild(avatarEl(options.profile));
      var text = document.createElement("span");
      text.textContent = label;
      b.appendChild(text);
      if (options.note) {
        var note = document.createElement("span");
        note.className = "note";
        note.textContent = options.note;
        b.appendChild(note);
      }
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        if (Date.now() - profilesOpenedAt > 500) run();
      });
      profileItems.push({ el: b, run: run });
      profilesListEl.appendChild(b);
    }

    function markProfile(index) {
      profileIndex = Math.max(0, Math.min(profileItems.length - 1, index));
