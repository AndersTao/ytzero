      profileItems.forEach(function (item, k) { item.el.classList.toggle("focused", !onPin && k === profileIndex); });
      renderPinDigits();
    }

    function renderPinDigits() {
      if (!pin || profilesView !== "pin") return;
      var boxes = pinRowEl.children;
      for (var k = 0; k < boxes.length; k++) {
        boxes[k].textContent = pin.digits[k] == null ? "–" : "•";
        boxes[k].classList.toggle("focused", pin.onRow && k === pin.at);
      }
      // The digit being chosen with Up/Down shows; the others stay hidden.
      if (pin.onRow && pin.digits[pin.at] != null) boxes[pin.at].textContent = String(pin.digits[pin.at]);
    }

    function renderProfiles(focusIndex) {
      profileItems = [];
      profilesListEl.innerHTML = "";
      pinRowEl.hidden = profilesView !== "pin";
      var title = document.getElementById("profilesTitle");
      var hint = document.getElementById("profilesHint");
      hint.textContent = "";
      if (profilesView === "pin") {
        title.textContent = pin.kind === "child" ? "Børnesikringens PIN" : "PIN for " + pin.target.name;
        hint.textContent = pin.kind === "child"
          ? "En voksen skal indtaste PIN-koden for at forlade børneprofilen."
          : "Indtast profilens PIN-kode.";
        pinRowEl.innerHTML = "";
        for (var k = 0; k < 6; k++) {
          var box = document.createElement("div");
          box.className = "pin-digit";
          pinRowEl.appendChild(box);
        }
        profileItem("Annuller", function () { profilesView = "list"; pin = null; renderProfiles(); });
      } else if (profilesView === "remove") {
        title.textContent = "Fjern profil";
        hint.textContent = "Profilen logges ud på dette TV. Du kan tilføje den igen senere.";
        profileState.profiles.forEach(function (p) {
          if (p.id !== profileState.activeId) profileItem(p.name, function () { removeProfile(p); }, { profile: p, danger: true });
        });
        profileItem("Tilbage", function () { profilesView = "list"; renderProfiles(); });
      } else {
        title.textContent = "Hvem ser med?";
        if (!profileState.canSwitch && profileState.profiles.length < 2) {
          hint.textContent = "Tilføj en profil for at kunne skifte mellem flere på dette TV.";
        }
        profileState.profiles.forEach(function (p) {
          profileItem(p.name, function () { switchProfile(p); }, { profile: p, note: p.id === profileState.activeId ? "I brug" : "" });
        });
        if (!profileState.canSwitch) {
          profileItem("Tilføj profil", addProfile);
          if (profileState.profiles.length > 1) profileItem("Fjern profil", function () { profilesView = "remove"; renderProfiles(); });
        }
        profileItem("Luk", leaveProfiles);
      }
      var start = focusIndex;
      if (start == null) {
        start = 0;
        if (profilesView === "list") {
          // Start on the profile in use, so OK by mistake changes nothing.
          profileState.profiles.forEach(function (p, k) { if (p.id === profileState.activeId) start = k; });
        }
      }
      markProfile(start);
    }

    function openProfiles() {
      if (profilesOpen || placesOpen || current || menuOpen) return;
      profilesOpen = true;
      profilesOpenedAt = Date.now();
      profilesView = "list";
      pin = null;
      renderProfiles();
      profilesEl.hidden = false;
      // Back closes it through history, like the menu.
      history.pushState({ tvProfiles: true }, "");
      loadProfiles().then(function () { if (profilesOpen && profilesView === "list") renderProfiles(profileIndex); });
    }

    function leaveProfiles() { if (profilesOpen) history.back(); }

    function closeProfiles() {
      profilesOpen = false;
      profilesEl.hidden = true;
      pin = null;
      restoreFocus(null);
    }

    function askPin(target, kind, childPin) {
      pin = { target: target, kind: kind, childPin: childPin || null, digits: [null, null, null, null, null, null], at: 0, onRow: true };
      profilesView = "pin";
      renderProfiles(0);
    }

    function submitPin() {
      if (!pin) return;
      for (var k = 0; k < 6; k++) if (pin.digits[k] == null) { pin.at = k; renderPinDigits(); return; }
      var code = pin.digits.join("");
      if (pin.kind === "child") switchProfile(pin.target, code, null);
      else switchProfile(pin.target, pin.childPin, code);
    }

    function switchProfile(p, childPin, profilePin) {
      if (p.id === profileState.activeId) { leaveProfiles(); return; }
      if (profilesBusy) return;
      profilesBusy = true;
      var body = { id: p.id };
      if (childPin) body.child_lock_pin = childPin;
      if (profilePin) body.pin = profilePin;
      send("POST", profileState.canSwitch ? "/profiles/switch" : "/auth/device/profiles/switch", body).then(function (r) {
        profilesBusy = false;
        if (r.status === 200 && !r.body.requires_relogin) {
          toast("Skifter til " + p.name + "…", 0);
          // Everything on the page belonged to the other profile: start over.
          window.location.reload();
          return;
        }
        if (r.status === 401) {
          if (r.body.pin_locked) {
            toast("Børneprofilen er låst. En voksen kan låse den op.", 4000);
            profilesView = "list"; pin = null; renderProfiles();
            return;
          }
          var active = activeProfile();
          if (!childPin && (r.body.pin_required || (active && active.child))) { askPin(p, "child", null); return; }
          if (profileState.canSwitch && p.hasPin && !profilePin) { askPin(p, "profile", childPin); return; }
          toast("Forkert PIN-kode");
          if (profilePin) askPin(p, "profile", childPin); else askPin(p, "child", null);
          return;
        }
        if (r.status === 404) {
          toast("Profilen er ikke logget ind på dette TV længere");
          profilesView = "list"; pin = null;
          loadProfiles().then(function () { if (profilesOpen) renderProfiles(); });
          return;
        }
        toast("Det lykkedes ikke – prøv igen");
      }).catch(function () {
        profilesBusy = false;
        toast("Det lykkedes ikke – prøv igen");
      });
    }

    // The pairing page again, approved on the phone of whoever is added. It
    // links the new session to this TV's and comes back here as that profile.
    function addProfile() { window.location.replace("/tv-login.html?add=1"); }

    function removeProfile(p) {
      if (profilesBusy) return;
      profilesBusy = true;
      send("DELETE", "/auth/device/profiles/" + encodeURIComponent(p.id)).then(function (r) {
        profilesBusy = false;
        if (r.status !== 200 && r.status !== 404) { toast("Det lykkedes ikke – prøv igen"); return; }
        toast(p.name + " er fjernet fra dette TV");
        profilesView = "list";
        return loadProfiles().then(function () { if (profilesOpen) renderProfiles(); });
      }).catch(function () {
        profilesBusy = false;
        toast("Det lykkedes ikke – prøv igen");
      });
    }

    function digitOf(code) {
      if (code >= 48 && code <= 57) return code - 48;
      if (code >= 96 && code <= 105) return code - 96;
      return null;
    }

    function pinKey(code) {
      var digit = digitOf(code);
      if (digit != null) {
        var at = pin.at;
        pin.digits[at] = digit;
        if (at < 5) pin.at = at + 1;
        renderPinDigits();
        // The sixth digit typed sends it, as a PIN pad does.
        if (at === 5 && pin.digits.every(function (d) { return d != null; })) submitPin();
        return true;
      }
      var value = pin.digits[pin.at];
      switch (code) {
        case KEY.UP: pin.digits[pin.at] = value == null ? 0 : (value + 1) % 10; renderPinDigits(); return true;
        case KEY.DOWN:
          if (value == null) { pin.onRow = false; markProfile(0); return true; }
          pin.digits[pin.at] = (value + 9) % 10; renderPinDigits(); return true;
        case KEY.LEFT: pin.at = Math.max(0, pin.at - 1); renderPinDigits(); return true;
        case KEY.RIGHT: pin.at = Math.min(5, pin.at + 1); renderPinDigits(); return true;
        case KEY.ENTER: submitPin(); return true;
        case KEY.BACKSPACE: pin.digits[pin.at] = null; pin.at = Math.max(0, pin.at - 1); renderPinDigits(); return true;
      }
      return false;
    }

    function profilesKey(code, e) {
      // The OK that opened the list, still held or repeating, must not pick from it.
      if (code === KEY.ENTER && (e.repeat || Date.now() - profilesOpenedAt < 500)) return true;
      if (code === KEY.BACK) {
        // As in the menu: webOS may step back by itself.
        clearTimeout(backTimer);
        backTimer = setTimeout(function () { if (profilesOpen) history.back(); }, 300);
        return true;
      }
      if (code === KEY.ESC) { leaveProfiles(); return true; }
      if (pin && profilesView === "pin" && pin.onRow && pinKey(code)) return true;
      switch (code) {
        case KEY.UP:
          if (pin && profilesView === "pin" && profileIndex === 0) { pin.onRow = true; markProfile(0); return true; }
          markProfile(profileIndex - 1); return true;
        case KEY.DOWN: markProfile(profileIndex + 1); return true;
        case KEY.ENTER: if (profileItems[profileIndex]) profileItems[profileIndex].run(); return true;
        case KEY.BACKSPACE: leaveProfiles(); return true;
      }
      return true; // nothing else reaches the page while the list is open
    }

    profileBtn.addEventListener("click", function () { focusTop(true, topButtons().indexOf(profileBtn)); openProfiles(); });
    profilesEl.addEventListener("click", function (e) { if (e.target === profilesEl) leaveProfiles(); });

    // ---------- Player ----------

    var player = null;
    var current = null;
    var overlayTimer = null;
    var flashTimer = null;
    var tickTimer = null;
    var lastSaved = 0;
    var captionsStarted = false;

    var ytReady = null;
    function loadYouTube() {
      if (ytReady) return ytReady;
      ytReady = new Promise(function (resolve) {
        if (window.YT && window.YT.Player) return resolve();
        window.onYouTubeIframeAPIReady = function () { resolve(); };
        var s = document.createElement("script");
        s.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(s);
      });
      return ytReady;
    }

    function fmt(seconds) {
      seconds = Math.max(0, Math.floor(seconds || 0));
      var h = Math.floor(seconds / 3600), m = Math.floor(seconds % 3600 / 60), s = seconds % 60;
      var mm = h ? String(m).padStart(2, "0") : String(m);
      return (h ? h + ":" : "") + mm + ":" + String(s).padStart(2, "0");
    }

    function position() { try { return player.getCurrentTime() || 0; } catch (e) { return 0; } }
    function duration() { try { return player.getDuration() || 0; } catch (e) { return 0; } }
    function isPlaying() { try { return player.getPlayerState() === 1; } catch (e) { return false; } }

    function updateOverlay() {
      var d = duration(), p = position();
      document.getElementById("barFill").style.width = d ? Math.min(100, p / d * 100) + "%" : "0";
      document.getElementById("time").textContent = fmt(p) + " / " + fmt(d);
    }

    function showOverlay(stay) {
      updateOverlay();
      overlayEl.classList.add("show");
      clearTimeout(overlayTimer);
      if (!stay) overlayTimer = setTimeout(function () { if (isPlaying()) overlayEl.classList.remove("show"); }, 3500);
    }

    function flash(text) {
      flashEl.textContent = text;
      flashEl.classList.add("show");
      clearTimeout(flashTimer);
      flashTimer = setTimeout(function () { flashEl.classList.remove("show"); }, 900);
    }

    // cc_load_policy=0 is not "off": YouTube restores a remembered caption track,
    // so the captions module is unloaded on ready, on first play and once after.
    function captionsOff() {
      try { player.unloadModule("captions"); } catch (e) {}
      try { player.unloadModule("cc"); } catch (e) {}
    }

    function saveProgress(keepalive) {
      if (!current || !player) return Promise.resolve();
      var p = position(), d = duration();
      if (!d || p < 1) return Promise.resolve();
      lastSaved = p;
      current.watch_position = p;
      current.watch_duration = d;
      return fetch("/api/videos/" + encodeURIComponent(current.video_id) + "/progress", {
        method: "PUT", credentials: "same-origin", keepalive: !!keepalive,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ position: p, duration: d })
      }).catch(function () {});
    }

    function openPlayer() {
      var v = focusedVideo();
      if (!v || current) return;
      current = v;
      captionsStarted = false;
      errorEl.hidden = true;
      document.getElementById("ovChannel").textContent = v.channel_title || "";
      document.getElementById("ovTitle").textContent = v.title || "";
      playerEl.hidden = false;
      document.body.classList.add("playing");
      showOverlay(true);
      // Back closes the player through history, which is what the LG remote's
      // Back button does in a webOS web app.
      history.pushState({ tvPlayer: true }, "");
      // A history row is what puts the video on the "Continue watching" shelf.
      post("/videos/" + encodeURIComponent(v.video_id) + "/watch").catch(function () {});
      loadSkips(v);

      var start = 0;
      if (v.watch_position && v.watch_duration && v.watch_position > 10 && v.watch_position < v.watch_duration - 30) {
        start = Math.floor(v.watch_position);
      }

      loadYouTube().then(function () {
        if (current !== v) return;
        var mount = document.createElement("div");
        document.getElementById("frame").appendChild(mount);
        player = new YT.Player(mount, {
          host: "https://www.youtube-nocookie.com",
          videoId: v.video_id,
          width: "100%", height: "100%",
          playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, iv_load_policy: 3,
                        cc_load_policy: 0, playsinline: 1, start: start, origin: location.origin },
          events: {
            onReady: function (e) {
              try { e.target.getIframe().setAttribute("tabindex", "-1"); } catch (err) {}
              captionsOff();
              e.target.playVideo();
            },
            onStateChange: function (e) {
              if (e.data === 1) {
                if (!captionsStarted) { captionsStarted = true; captionsOff(); setTimeout(captionsOff, 1500); }
                showOverlay(false);
              } else if (e.data === 2) {
                showOverlay(true);
              } else if (e.data === 0) {
                post("/videos/" + encodeURIComponent(v.video_id) + "/complete").catch(function () {});
                finished = v.video_id;
                history.back();
              }
            },
            onError: function () {
              errorEl.textContent = "Videoen kan ikke afspilles her. Tryk Back for at gå tilbage.";
              errorEl.hidden = false;
            }
          }
        });
        tickTimer = setInterval(function () {
          if (overlayEl.classList.contains("show")) updateOverlay();
          if (isPlaying() && Math.abs(position() - lastSaved) >= 15) saveProgress(false);
        }, 1000);
      });
    }

    var finished = null;

    // ---------- SponsorBlock ----------

    /*
     * The parts the profile has SponsorBlock skip (Settings → Privacy on the
     * web: sponsors, intros and so on), jumped past as they come up, as the
     * web player does. A skip is counted where the web counts its own.
     */
    var SKIP_NAMES = { sponsor: "Sponsor", selfpromo: "Selvpromovering", interaction: "Interaktion", intro: "Intro",
                       outro: "Outro", preview: "Forhåndsvisning", music_offtopic: "Afsnit uden musik", filler: "Fyld" };
    var skips = [];
    var countedSkips = {};
    var skipTimer = null;

    function loadSkips(v) {
      skips = [];
      if (v.live_status === "live") return;
      api("/videos/" + encodeURIComponent(v.video_id) + "/skip-segments").then(function (data) {
        if (current !== v || !data || !data.segments || !data.segments.length) return;
        skips = data.segments;
        clearInterval(skipTimer);
        skipTimer = setInterval(function () { skipIfInSegment(v); }, 250);
      }).catch(function () {});
    }

    function skipIfInSegment(v) {
      if (!player || current !== v || !isPlaying()) return;
      var at = position();
      for (var k = 0; k < skips.length; k++) {
        var seg = skips[k];
        if (at >= seg.start && at < seg.end - 0.3) {
          player.seekTo(seg.end, true);
          toast("Sprunget over: " + (SKIP_NAMES[seg.category] || seg.category));
          if (!countedSkips[seg.uuid]) {
            countedSkips[seg.uuid] = true;
            fetch("/api/videos/" + encodeURIComponent(v.video_id) + "/sponsorblock-skip", {
              method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ category: seg.category, skipped_seconds: seg.end - at, segment_start: seg.start, segment_end: seg.end, segment_uuid: seg.uuid })
            }).catch(function () {});
          }
          return;
        }
      }
    }

    function closePlayer() {
      if (!current) return;
      // A video just marked watched, rejected or played to the end must not get
      // a fresh position, or it would land on the Continue shelf again.
      var saved = !removed[current.video_id] && finished !== current.video_id ? saveProgress(true) : Promise.resolve();
      clearInterval(tickTimer);
      clearInterval(skipTimer);
      skips = [];
      clearTimeout(overlayTimer);
      try { player && player.destroy(); } catch (e) {}
      player = null;
      current = null;
      lastSaved = 0;
      document.getElementById("frame").innerHTML = "";
      overlayEl.classList.remove("show");
      playerEl.hidden = true;
      document.body.classList.remove("playing");
      // Played to the end it leaves the lists, though not a playlist.
      if (finished) { if (place.kind !== "playlist") removeVideo(finished); finished = null; }
      restoreFocus(null);
      // What was just watched now belongs on (or moves within) the Continue shelf,
      // once its new position is stored.
      saved.then(loadContinue);
    }

    function togglePlay() {
      if (!player) return;
      if (isPlaying()) { player.pauseVideo(); flash("❚❚"); }
      else { player.playVideo(); flash("▶"); }
    }

    function seek(delta) {
      if (!player) return;
      var d = duration();
      var target = Math.max(0, position() + delta);
      if (d) target = Math.min(target, Math.max(0, d - 1));
      player.seekTo(target, true);
      flash(delta > 0 ? "+" + delta + " s" : "−" + Math.abs(delta) + " s");
      showOverlay(!isPlaying());
    }

    var backTimer = null;

    function playerKey(code) {
      switch (code) {
        case KEY.RIGHT: case KEY.FF: seek(SEEK_FORWARD); return true;
        case KEY.LEFT: case KEY.RW: seek(-SEEK_BACK); return true;
        case KEY.ENTER: case KEY.PLAY_PAUSE: togglePlay(); return true;
        case KEY.PLAY: if (!isPlaying()) togglePlay(); return true;
        case KEY.PAUSE: if (isPlaying()) togglePlay(); return true;
        case KEY.UP: case KEY.DOWN: showOverlay(false); return true;
        case KEY.BACK:
          // webOS may already turn Back into history.back() itself; only step
          // back here if that did not happen, or Back would leave the app.
          clearTimeout(backTimer);
          backTimer = setTimeout(function () { if (current) history.back(); }, 300);
          return true;
        case KEY.ESC: case KEY.BACKSPACE: case KEY.STOP: history.back(); return true;
      }
      return false;
    }

    document.getElementById("clickLayer").addEventListener("click", togglePlay);
    window.addEventListener("popstate", function () {
      clearTimeout(backTimer);
      if (profilesOpen) closeProfiles();
      else if (placesOpen) closePlaces();
      else if (menuOpen) closeMenu();
      else if (current) closePlayer();
      else if (place.kind !== "main") showPlace(MAIN); // Back from another place

    });

    /*
     * OK on a card: a press plays, a hold opens the menu. The remote repeats
     * keydown while OK is held and sends one keyup on release, so the press is
     * decided on keyup and the hold by a timer. A keyup that never arrives must
     * not leave OK dead: a keydown well after the last one is a new press.
     */
    var okDown = false;
    var okHeld = false;
    var okLast = 0;
    var okTimer = null;

    function okIsRepeat(e) {
      var now = Date.now();
      var repeat = okDown && (e.repeat || now - okLast < 1500);
      okLast = now;
      return repeat;
    }

    document.addEventListener("keydown", function (e) {
      var code = e.keyCode;
      if (profilesOpen) {
        if (profilesKey(code, e)) e.preventDefault();
        return;
      }
      if (placesOpen) {
        if (placesKey(code, e)) e.preventDefault();
        return;
      }
      if (menuOpen) {
        // The OK still held from opening the menu must not pick its first line.
        if (code === KEY.ENTER && okIsRepeat(e)) { e.preventDefault(); return; }
        okDown = false;
        if (menuKey(code)) e.preventDefault();
        return;
      }
      // On a card OK is decided on release (a hold opens the menu); on a time in Scheduled it acts at once.
      if (code === KEY.ENTER && !current && focus.s !== "top" && !(focus.s === "sched" && schedCol > 0)) {
        e.preventDefault();
        if (okIsRepeat(e)) return;
        okDown = true;
        okHeld = false;
        clearTimeout(okTimer);
        okTimer = setTimeout(function () { okHeld = true; openMenu(); }, HOLD_MS);
        return;
      }
      var handled = numberKey(code) || (current ? playerKey(code) : browseKey(code));
      if (handled) e.preventDefault();
    });

    document.addEventListener("keyup", function (e) {
      if (e.keyCode !== KEY.ENTER) return;
      var pressed = okDown && !okHeld;
      okDown = false;
      okHeld = false;
      clearTimeout(okTimer);
      if (pressed && !current && !menuOpen && !profilesOpen && !placesOpen) openPlayer();
    });

    /*
     * The pointer moves the mark only when it really moves. A card that scrolls
     * under a pointer standing still gets mouse events too (the browser sends
     * them after every scroll), and following those pulled the mark back to
     * wherever the hidden pointer was: a press of Up landed one row up and
     * then jumped back, so it took two.
     */
    var pointerAt = null;
    document.addEventListener("mousemove", function (e) {
      var moved = !pointerAt || pointerAt.x !== e.screenX || pointerAt.y !== e.screenY;
      pointerAt = { x: e.screenX, y: e.screenY };
      if (!moved || current || menuOpen || profilesOpen || placesOpen) return;
      var target = e.target && e.target.closest ? e.target : null;
      if (!target) return;
      var top = target.closest("#placeBtn, #profileBtn, #refreshBtn");
      if (top) { var at = topButtons().indexOf(top); if (focus.s !== "top" || focus.i !== at) focusTop(true, at); return; }
      var timeBtn = target.closest(".sched-btn");
      if (timeBtn) {
        var rowCard = timeBtn.closest(".sched-row").querySelector(".card");
        var ri = sections.sched ? sections.sched.cards.indexOf(rowCard) : -1;
        var col = Array.prototype.slice.call(timeBtn.closest(".sched-row").querySelectorAll(".sched-btn")).indexOf(timeBtn) + 1;
        if (ri >= 0 && !(focus.s === "sched" && focus.i === ri && schedCol === col)) { schedCol = col; setFocus("sched", ri, true); }
        return;
      }
      var card = target.closest(".card");
      if (!card) return;
      var name = card.dataset.section;
      var backOnVideo = name === "sched" && schedCol !== 0;
      var i = sections[name] ? sections[name].cards.indexOf(card) : -1;
      if (i >= 0 && (backOnVideo || !(focus.s === name && focus.i === i))) { schedCol = 0; setFocus(name, i, true); }
    });

    window.addEventListener("pagehide", function () { saveProgress(true); });

    loadContinue().then(loadMore);
    loadProfiles();
  })();
  </script>
</body>
</html>
