<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <meta name="robots" content="noindex">
  <title>YT Zero · Log ind på TV</title>
  <style>
    html, body {
      margin: 0; height: 100%;
      background: #0f0f0f; color: #f1f1f1;
      font-family: "LG Smart UI", "Museo Sans", system-ui, sans-serif;
    }
    body { display: flex; align-items: center; justify-content: center; }
    main { display: flex; align-items: center; gap: 96px; }
    #qr {
      width: 440px; height: 440px; border-radius: 24px; background: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    #qr svg { width: 400px; height: 400px; display: block; }
    #qr.empty { background: #1c1c1c; }
    .text { max-width: 820px; }
    h1 { font-size: 56px; margin: 0 0 28px; font-weight: 600; }
    p { font-size: 32px; line-height: 1.4; margin: 0 0 20px; opacity: .8; }
    #url { font-size: 30px; opacity: .65; word-break: break-all; }
    #code {
      font-size: 88px; font-weight: 700; letter-spacing: .12em; margin: 28px 0 32px;
      font-variant-numeric: tabular-nums;
    }
    #status { font-size: 28px; opacity: .55; min-height: 1.4em; }
    #status.error { color: #ff6b6b; opacity: .9; }
    #back { margin-top: 28px; font-size: 26px; opacity: .55; }
    #back[hidden] { display: none; }
    /* The launch screen the TV app opens on, held until there is something to show. */
    #splash {
      position: fixed; inset: 0; z-index: 30; background: #2a5ef6;
      display: flex; align-items: center; justify-content: center; transition: opacity .3s ease;
    }
    #splash svg { width: 135px; height: 150px; margin-left: 14px; }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="splash"><svg viewBox="0 0 135 150" aria-hidden="true"><path d="M20 10 L125 75 L20 140 Z" fill="#fff" stroke="#fff" stroke-width="20" stroke-linejoin="round"/></svg></div>
  <main>
    <div id="qr" class="empty"></div>
    <div class="text">
      <h1 id="heading">Log ind på YT Zero</h1>
      <p id="lead">Scan QR-koden med telefonen, log ind og godkend TV'et.</p>
      <p id="url"></p>
      <div id="code">····-····</div>
      <div id="status">Henter kode…</div>
      <p id="back" hidden>Tryk Tilbage for at fortryde.</p>
    </div>
  </main>

  <script>/*QRCODE_LIB*/</script>
  <script>
    (function () {
      var DEVICE_NAME = "LG TV";
      // ?add=1: the TV is signed in already and adds another profile. The new
      // session is linked to the one it has, so it can switch between them.
      var ADDING = /[?&]add=1(&|$)/.test(window.location.search);

      var qrEl = document.getElementById("qr");
      var codeEl = document.getElementById("code");
      var urlEl = document.getElementById("url");
      var statusEl = document.getElementById("status");
      var pollTimer = null, expireTimer = null;

      function setStatus(text, isError) {
        statusEl.textContent = text;
        statusEl.className = isError ? "error" : "";
      }

      function post(path, body) {
        return fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
          credentials: "same-origin",
          cache: "no-store"
        });
      }

      // The TV has its own simple, view-only page (tv.html).
      function goHome() { window.location.replace("/tv.html"); }

      // The launch screen stays up while the TV checks it is signed in, so a TV
      // that is goes straight from it to its videos and never shows this page.
      function showLogin() { document.getElementById("splash").hidden = true; start(); }

      function formatCode(code) {
        var c = String(code).replace(/[^0-9A-Za-z]/g, "").toUpperCase();
        return c.length === 8 ? c.slice(0, 4) + "-" + c.slice(4) : String(code).toUpperCase();
      }

      function drawQr(text) {
        var qr = qrcode(0, "M");
        qr.addData(text);
        qr.make();
        qrEl.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
        qrEl.className = "";
      }

      function stopTimers() { clearTimeout(pollTimer); clearTimeout(expireTimer); }

      function start() {
        stopTimers();
        setStatus("Henter kode…");
        post("/api/auth/device/code", { device_name: DEVICE_NAME })
          .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
          .then(function (d) {
            codeEl.textContent = formatCode(d.user_code);
            urlEl.textContent = "Eller gå til " + d.verification_uri;
            drawQr(d.verification_uri_complete || d.verification_uri);
            setStatus("Venter på godkendelse…");
            var interval = Math.max(2, Number(d.interval) || 5) * 1000;
            expireTimer = setTimeout(start, Math.max(30, Number(d.expires_in) || 600) * 1000);
            poll(d.device_code, interval);
          })
          .catch(function () {
            setStatus("Kunne ikke hente en kode. Prøver igen…", true);
            pollTimer = setTimeout(start, 10000);
          });
      }

      function poll(deviceCode, interval) {
        pollTimer = setTimeout(function () {
          // set_cookie: the server sets the usual HttpOnly session cookie itself.
          post("/api/auth/device/token", { device_code: deviceCode, set_cookie: true, link_session: ADDING })
            .then(function (r) {
              if (r.status === 428) return poll(deviceCode, interval);   // venter stadig
              if (r.status === 400) return start();                      // koden er udløbet
              if (!r.ok) throw new Error("HTTP " + r.status);
              stopTimers();
              setStatus("Godkendt – åbner YT Zero…");
              goHome();
            })
            .catch(function () {
              setStatus("Mistede forbindelsen. Prøver igen…", true);
              poll(deviceCode, interval * 2);
            });
        }, interval);
      }

      if (ADDING) {
        document.getElementById("heading").textContent = "Tilføj en profil";
        document.getElementById("lead").textContent = "Scan QR-koden med telefonen, og log ind som den, der skal tilføjes. TV'et kan derefter skifte mellem profilerne.";
        document.getElementById("back").hidden = false;
        document.getElementById("splash").hidden = true;
        // Back (or Escape) returns to the videos without adding anyone.
        document.addEventListener("keydown", function (e) {
          if (e.keyCode === 461 || e.keyCode === 27 || e.keyCode === 8) {
            e.preventDefault();
            stopTimers();
            goHome();
          }
        });
        start();
        return;
      }

      // Allerede logget ind? Så direkte videre.
      fetch("/api/auth/status", { credentials: "same-origin", cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (s) { if (s && s.authenticated) goHome(); else showLogin(); })
        .catch(showLogin);
    })();
  </script>
</body>
</html>
