name: YTZeroTV
options:
  bundleIdPrefix: app.ytzero
  deploymentTarget:
    tvOS: "26.0"
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, da, Base]
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  YTZeroTV:
    type: application
    platform: tvOS
    sources:
      - path: YTZeroTV
    scheme:
      testTargets:
        - YTZeroTVUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(YTZERO_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(YTZERO_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: YT Zero
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "YT Zero connects to your own YT Zero server on the local network."
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  # iPhone and iPad. Server, pairing, library and playback logic are the Apple
  # TV app's own files; only the screens are written for touch.
  YTZeroiOS:
    type: application
    platform: iOS
    sources:
      - path: YTZeroiOS
      - path: YTZeroTV/Core
      - path: YTZeroTV/Features/Home/HomeModel.swift
      - path: YTZeroTV/Features/Home/LiveBadge.swift
      - path: YTZeroTV/Features/Home/DurationBadge.swift
      - path: YTZeroTV/Features/Home/DayGroups.swift
      - path: YTZeroTV/Features/Home/ProgressBar.swift
      - path: YTZeroTV/Features/Home/Thumbnail.swift
      - path: YTZeroTV/Features/Home/ThumbnailCache.swift
      - path: YTZeroTV/Features/Pairing/PairingModel.swift
      - path: YTZeroTV/Features/Pairing/QRCode.swift
      - path: YTZeroTV/Features/Settings/ProfileAvatar.swift
      - path: YTZeroTV/Features/Settings/SettingsView.swift
      - path: YTZeroTV/Features/Player/PlayerModel.swift
      - path: YTZeroTV/Features/Player/PlaybackTime.swift
      - path: YTZeroTV/Features/Player/PlayerLayerView.swift
      - path: YTZeroTV/Resources/Localizable.xcstrings
      - path: YTZeroTV/Resources/InfoPlist.xcstrings
    scheme:
      testTargets:
        - YTZeroiOSUITests
    info:
      path: YTZeroiOS/Info.plist
      properties:
        # Sound keeps going with the screen off, and picture in picture.
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(YTZERO_IOS_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(YTZERO_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: YT Zero
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "YT Zero connects to your own YT Zero server on the local network."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  YTZeroiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YTZeroiOSUITests
    dependencies:
      - target: YTZeroiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(YTZERO_IOS_BUNDLE_ID).uitests
        DEVELOPMENT_TEAM: $(YTZERO_DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: YTZeroiOS
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
  YTZeroTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: YTZeroTVUITests
    dependencies:
      - target: YTZeroTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(YTZERO_BUNDLE_ID).uitests
        DEVELOPMENT_TEAM: $(YTZERO_DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: YTZeroTV
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
