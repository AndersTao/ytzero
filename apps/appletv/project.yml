name: YTZeroTV
options:
  bundleIdPrefix: app.ytzero
  deploymentTarget:
    tvOS: "26.0"
  developmentLanguage: en
  knownRegions: [en, da, Base]
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  YTZeroTV:
    type: application
    platform: tvOS
    sources:
      - path: YTZeroTV
    scheme:
      testTargets:
        - YTZeroTVUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(YTZERO_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(YTZERO_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: YT Zero
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "YT Zero connects to your own YT Zero server on the local network."
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  YTZeroTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: YTZeroTVUITests
    dependencies:
      - target: YTZeroTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(YTZERO_BUNDLE_ID).uitests
        DEVELOPMENT_TEAM: $(YTZERO_DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: YTZeroTV
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
